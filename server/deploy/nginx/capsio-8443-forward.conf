# conf.d/capsio.conf on Tencent Cloud (124.221.115.83) since 2026-11-25. The service moved to
# https://capsio.cloud; apps built before that still call https://124.221.115.83:8443, and this
# port forwards them there over kept-alive connections, so each request costs one extra round
# trip rather than a new TLS handshake. capsio.cloud's server takes the user's address from
# X-Forwarded-For and applies the per-address limits. Nginx resolves capsio.cloud when it loads:
# reload after the address changes. Remove this once the access log shows no more traffic here.

upstream capsio_cloud {
    server capsio.cloud:443;
    keepalive 16;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # TokenGift's certificate for 124.221.115.83 (read only); tokengift-cert-renew.timer renews it.
    ssl_certificate /etc/tokengift-letsencrypt/live/tokengift-ip/fullchain.pem;
    ssl_certificate_key /etc/tokengift-letsencrypt/live/tokengift-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    location ~ ^/(v1/|admin) {
        proxy_pass https://capsio_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host capsio.cloud;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name capsio.cloud;
        proxy_ssl_verify on;
        # Leaf, intermediate, root: Let's Encrypt chains need depth 2 (the default is 1).
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # Model answers stream; sync pages can take a while on slow links.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        return 404;
    }
}
