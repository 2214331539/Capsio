# https://capsio.cloud/: /etc/nginx/sites-available/capsio, linked into
# sites-enabled. Needs capsio-limits.conf in conf.d/ and capsio-proxy.conf in snippets/.
# sites-enabled loads after conf.d/, so the other site's server, which its apps reach by IP without SNI,
# stays the default for ports 80 and 443. Nginx is 1.24 here: no `http2 on`, and http2 on a
# listen line would turn it on for the other site as well.
#
#   /          the website: /var/www/capsio/current, from the website repository's scripts/deploy.sh
#   /v1/       the collaboration API: capsio-collab on 127.0.0.1:8081
#   /admin     its admin pages
#   /discuss/  the forum: capsio-community (NodeBB) on 127.0.0.1:4567
#
# Certificate: certbot with the webroot below; the host's renewal timer
# runs `certbot renew`, which renews this one too and reloads Nginx.

server {
    listen 80;
    server_name capsio.cloud www.capsio.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/capsio-acme;
        default_type text/plain;
    }
    location / { return 301 https://capsio.cloud$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.capsio.cloud;
    ssl_certificate /etc/letsencrypt/live/capsio.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capsio.cloud/privkey.pem;

    location / { return 301 https://capsio.cloud$request_uri; }
}

server {
    listen 443 ssl;
    server_name capsio.cloud;
    ssl_certificate /etc/letsencrypt/live/capsio.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capsio.cloud/privkey.pem;

    # Apps from before the move call https://124.221.115.83:8443, which forwards here. The user's
    # address comes from that server's header, so per-address limits stay per user.
    set_real_ip_from 124.221.115.83;
    real_ip_header X-Forwarded-For;

    root /var/www/capsio/current;
    index index.html;
    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
        # Pages are revalidated so a new release shows up at once; hashed assets stay cached.
        add_header Cache-Control "no-cache";
    }
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API. Sync pushes may carry several notes (PDFs go straight to OSS), and over-limit
    # requests get 429, which the app explains as "too many requests".
    location = /v1/auth/send-code {
        limit_req zone=capsio_codes burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/capsio-proxy.conf;
    }
    location ^~ /v1/ {
        client_max_body_size 16m;
        limit_req zone=capsio_api burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/capsio-proxy.conf;
    }
    # The admin pages and their API; sign-in codes there share the code limit.
    location = /admin/api/send-code {
        limit_req zone=capsio_codes burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/capsio-proxy.conf;
    }
    location ^~ /admin {
        limit_req zone=capsio_api burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/capsio-proxy.conf;
    }

    location = /discuss {
        return 301 /discuss/;
    }
    location ^~ /discuss/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:4567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
