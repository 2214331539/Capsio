<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Capsio</title>
  <desc id="desc">一个入口，贯穿科研全过程：文献、笔记、实验、写作和 AI 助手。</desc>
  <style>
    :root { --ink: #111A17; --muted: #5C6662; --line: #D3D9D6; --chip: #FFFFFF; --dot: #111A17; --glow: rgba(17, 26, 23, 0.05); }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #F7F8F6; --muted: #A3ADA8; --line: #34403B; --chip: #161D1A; --dot: #C6F24E; --glow: rgba(198, 242, 78, 0.16); }
    }
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .mark-body { fill: var(--ink); }
    .mark-dot { fill: var(--dot); animation: bob 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .track { stroke: var(--line); stroke-width: 2; stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .chip rect { fill: var(--chip); stroke: var(--line); stroke-width: 1.5; }
    .chip .halo { fill: var(--glow); opacity: 0; stroke: none; }
    .chip .bullet { fill: var(--line); }
    .chip { animation: lift 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .chip rect.box { animation: edge 6s ease-in-out infinite; }
    .chip .halo { animation: halo 6s ease-in-out infinite; }
    .chip .bullet { animation: bullet 6s ease-in-out infinite; }
    /* After the shorthands above, and as specific, so the delays are not reset. */
    .chip.c2, .chip.c2 * { animation-delay: 1.2s; }
    .chip.c3, .chip.c3 * { animation-delay: 2.4s; }
    .chip.c4, .chip.c4 * { animation-delay: 3.6s; }
    .chip.c5, .chip.c5 * { animation-delay: 4.8s; }
    .pulse { fill: var(--dot); animation: travel 6s cubic-bezier(.6, 0, .3, 1) infinite; }
    @keyframes travel {
      0%, 16% { transform: translateX(0); }
      20%, 36% { transform: translateX(204px); }
      40%, 56% { transform: translateX(408px); }
      60%, 76% { transform: translateX(612px); }
      80%, 96% { transform: translateX(816px); }
      100% { transform: translateX(816px); opacity: 0; }
    }
    @keyframes lift { 0%, 16% { transform: translateY(-4px); } 22%, 100% { transform: translateY(0); } }
    @keyframes edge { 0%, 16% { stroke: var(--dot); } 22%, 100% { stroke: var(--line); } }
    @keyframes halo { 0%, 16% { opacity: 1; } 22%, 100% { opacity: 0; } }
    @keyframes bullet { 0%, 16% { fill: var(--dot); } 22%, 100% { fill: var(--line); } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Mark -->
  <g transform="translate(556 18) scale(0.733)">
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <path d="M33.03 42.08 L60 26.5 L86.97 42.08 L60 57.65 Z" fill="#000"/>
      <rect x="57.58" y="57.65" width="4.85" height="51.22" fill="#000"/>
      <circle cx="60" cy="21.53" r="17.91" fill="#000"/>
    </mask>
    <path class="mark-body" mask="url(#cut)" d="M17.85 44.18 Q17.85 42.08 19.68 41.02 L58.17 18.8 Q60 17.74 61.83 18.8 L100.32 41.02 Q102.15 42.08 102.15 44.18 L102.15 80.43 Q102.15 82.54 100.32 83.59 L61.83 105.82 Q60 106.87 58.17 105.82 L19.68 83.59 Q17.85 82.54 17.85 80.43 Z"/>
    <circle class="mark-dot" cx="60" cy="21.53" r="13.07"/>
  </g>

  <text x="600" y="164" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="-1">Capsio</text>
  <text x="600" y="208" text-anchor="middle" font-size="24" font-weight="500">一个入口，贯穿科研全过程</text>
  <text x="600" y="240" text-anchor="middle" font-size="15" class="muted">Read papers, take notes, run experiments and write LaTeX, with an AI agent that works on your own files.</text>

  <!-- The research loop -->
  <line class="track" x1="192" y1="320" x2="1008" y2="320"/>
  <!-- Under the chips, so it shows only on the way between them. -->
  <circle class="pulse" cx="192" cy="320" r="5"/>
  <g class="chip c1">
    <rect class="halo" x="99" y="282" width="186" height="76" rx="22"/>
    <rect class="box" x="107" y="290" width="170" height="60" rx="16"/>
    <circle class="bullet" cx="134" cy="320" r="6"/>
    <text x="150" y="316" font-size="17" font-weight="600">文献</text>
    <text x="150" y="335" font-size="11.5" class="muted">Read &amp; annotate</text>
  </g>
  <g class="chip c2">
    <rect class="halo" x="303" y="282" width="186" height="76" rx="22"/>
    <rect class="box" x="311" y="290" width="170" height="60" rx="16"/>
    <circle class="bullet" cx="338" cy="320" r="6"/>
    <text x="354" y="316" font-size="17" font-weight="600">笔记与文档</text>
    <text x="354" y="335" font-size="11.5" class="muted">Notes &amp; docs</text>
  </g>
  <g class="chip c3">
    <rect class="halo" x="507" y="282" width="186" height="76" rx="22"/>
    <rect class="box" x="515" y="290" width="170" height="60" rx="16"/>
    <circle class="bullet" cx="542" cy="320" r="6"/>
    <text x="558" y="316" font-size="17" font-weight="600">实验</text>
    <text x="558" y="335" font-size="11.5" class="muted">Code &amp; runs</text>
  </g>
  <g class="chip c4">
    <rect class="halo" x="711" y="282" width="186" height="76" rx="22"/>
    <rect class="box" x="719" y="290" width="170" height="60" rx="16"/>
    <circle class="bullet" cx="746" cy="320" r="6"/>
    <text x="762" y="316" font-size="17" font-weight="600">写作</text>
    <text x="762" y="335" font-size="11.5" class="muted">LaTeX &amp; PDF</text>
  </g>
  <g class="chip c5">
    <rect class="halo" x="915" y="282" width="186" height="76" rx="22"/>
    <rect class="box" x="923" y="290" width="170" height="60" rx="16"/>
    <circle class="bullet" cx="950" cy="320" r="6"/>
    <text x="966" y="316" font-size="17" font-weight="600">AI 助手</text>
    <text x="966" y="335" font-size="11.5" class="muted">Local agent</text>
  </g>
</svg>
