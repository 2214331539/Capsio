<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsio · 写作页原型</title>
<style>
/* Capsio experiment workspace prototype: an IDE layout inside the app shell. */
:root,
[data-theme='graphite'] {
  --chrome: #f4f4f5;
  --canvas: #ffffff;
  --raised: #ffffff;
  --sunken: #fafafa;
  --hover: rgba(24, 24, 27, 0.045);
  --selected: rgba(24, 24, 27, 0.075);
  --focus-row: rgba(59, 91, 219, 0.1);
  --line: rgba(24, 24, 27, 0.08);
  --line-strong: rgba(24, 24, 27, 0.15);
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #71717a;
  --text-4: #a1a1aa;
  --accent: #18181b;
  --on-accent: #ffffff;
  --link: #2f5bd3;
  --ok: #2f7d4f;
  --warn: #a5650e;
  --bad: #c0392b;
  --info: #3b5bdb;
  --git-m: #a5650e;
  --git-a: #2f7d4f;
  --git-d: #c0392b;
  --add-bg: rgba(47, 125, 79, 0.09);
  --del-bg: rgba(192, 57, 43, 0.08);
  --shadow-pop: 0 0 0 1px rgba(0, 0, 0, 0.07), 0 10px 32px rgba(0, 0, 0, 0.12);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --code-kw: #7c3aed;
  --code-str: #2f7d4f;
  --code-num: #b45309;
  --code-com: #8b8b93;
  --note: #e8590c;
  color-scheme: light;
}
[data-theme='night'] {
  --chrome: #0e0e10;
  --canvas: #151517;
  --raised: #1c1c1f;
  --sunken: #121214;
  --hover: rgba(255, 255, 255, 0.05);
  --selected: rgba(255, 255, 255, 0.085);
  --focus-row: rgba(123, 147, 240, 0.16);
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #ededef;
  --text-2: #a3a3ab;
  --text-3: #85858e;
  --text-4: #5b5b63;
  --accent: #ededef;
  --on-accent: #111113;
  --link: #8aa4ff;
  --ok: #4fae73;
  --warn: #d49a3a;
  --bad: #e5675a;
  --info: #7b93f0;
  --git-m: #d49a3a;
  --git-a: #4fae73;
  --git-d: #e5675a;
  --add-bg: rgba(79, 174, 115, 0.11);
  --del-bg: rgba(229, 103, 90, 0.11);
  --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 10px 32px rgba(0, 0, 0, 0.5);
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #008300;
  --code-kw: #b197fc;
  --code-str: #69db7c;
  --code-num: #ffa94d;
  --code-com: #6f6f78;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  font: 13px/1.5 'Segoe UI Variable Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', system-ui, sans-serif;
  color: var(--text);
  background: var(--chrome);
  -webkit-font-smoothing: antialiased;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
svg.i {
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mono {
  font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
}
.muted {
  color: var(--text-3);
}
.spacer {
  flex: 1;
}

/* Shell */
.app {
  display: grid;
  grid-template-rows: 44px minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
  min-width: 1100px;
  min-height: 680px;
}
.titlebar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  padding: 0 8px 0 12px;
}
.logo {
  width: 18px;
  height: 18px;
  margin-right: 8px;
}
.ib {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  min-width: 28px;
  padding: 0 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  white-space: nowrap;
}
.ib:hover {
  background: var(--hover);
  color: var(--text);
}
.ib[aria-pressed='true'] {
  background: var(--selected);
  color: var(--text);
}
.ib:disabled {
  opacity: 0.4;
  cursor: default;
  background: transparent;
}
.ib.sm {
  height: 22px;
  min-width: 22px;
  padding: 0 3px;
}
.crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 6px;
  color: var(--text-3);
}
.crumbs b {
  color: var(--text);
  font-weight: 500;
}
.tb-search {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  width: 400px;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 7px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text-3);
  text-align: left;
}
.tb-search kbd {
  margin-left: auto;
  font-size: 11px;
}
.tb-sep {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: var(--line-strong);
}
.body {
  display: flex;
  min-width: 0;
  min-height: 0;
  padding: 0 8px 8px 0;
}

/* Sidebar */
.sidebar {
  width: 248px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 6px 8px 8px;
}
.uplink {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 26px;
  padding: 0 8px 0 4px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
}
.switcher {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  margin: 2px 0 6px;
  padding: 6px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
}
.mark {
  width: 18px;
  height: 24px;
  flex: none;
  border-radius: 2px 4px 4px 2px;
  background: #4f5866;
  box-shadow: inset 3px 0 0 rgba(0, 0, 0, 0.22);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  height: 30px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  text-align: left;
}
.nav-item:hover {
  background: var(--hover);
  color: var(--text);
}
.nav-item[aria-current] {
  background: var(--selected);
  color: var(--text);
  font-weight: 500;
}
.views {
  display: flex;
  gap: 2px;
  margin-top: 10px;
  padding: 8px 0 6px;
  border-top: 1px solid var(--line);
}
.views .ib {
  position: relative;
  flex: 1;
  height: 30px;
}
.views .ib[aria-pressed='true'] {
  color: var(--text);
}
.views .ib[aria-pressed='true']::after {
  content: '';
  position: absolute;
  left: 28%;
  right: 28%;
  bottom: -3px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.views .badge {
  position: absolute;
  top: 0;
  right: 4px;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--info);
  color: #fff;
  font: 600 10px/15px 'Segoe UI', sans-serif;
}
.view-title {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 28px;
  padding: 0 2px 0 6px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-3);
}
.view {
  flex: 1;
  min-height: 0;
  overflow: auto;
  margin: 0 -8px;
  padding: 0 8px 8px;
}
.sec {
  margin-top: 4px;
}
.sec-head {
  display: flex;
  align-items: center;
  gap: 2px;
  width: 100%;
  height: 24px;
  padding: 0 2px 0 2px;
  border: 0;
  background: transparent;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-2);
  text-align: left;
}
.sec-head .t {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 4px;
}
.sec-head .n {
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: 8px;
  background: var(--selected);
  font-size: 10.5px;
  font-weight: 500;
  line-height: 16px;
  color: var(--text-2);
}
.sec-head .acts {
  display: none;
}
.sec:hover .sec-head .acts {
  display: inline-flex;
}
.row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  height: 24px;
  padding: 0 6px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
  font-size: 12.5px;
  text-align: left;
  white-space: nowrap;
}
.row:hover {
  background: var(--hover);
  color: var(--text);
}
.row[aria-current] {
  background: var(--focus-row);
  color: var(--text);
}
.row .name {
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .dir {
  color: var(--text-4);
  font-size: 11.5px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .end {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--text-3);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.row .hov {
  display: none;
}
.row:hover .hov {
  display: inline-flex;
}
.row:hover .unhov {
  display: none;
}
.row svg.i {
  color: var(--text-3);
}
.git {
  width: 12px;
  text-align: center;
  font: 600 11px 'Cascadia Code', Consolas, monospace;
}
.git.M,
.name.M {
  color: var(--git-m);
}
.git.A,
.git.U,
.name.A,
.name.U {
  color: var(--git-a);
}
.git.D {
  color: var(--git-d);
}
.dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--text-4);
}
.dot.run {
  background: var(--info);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--info) 22%, transparent);
}
.dot.done {
  background: var(--ok);
}
.dot.fail {
  background: var(--bad);
}
.inputbox {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  margin: 4px 0;
  padding: 0 8px;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}
.inputbox input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 12.5px;
}
.inputbox .opt {
  padding: 0 3px;
  border-radius: 3px;
  font: 11px 'Cascadia Code', Consolas, monospace;
  color: var(--text-3);
}
textarea.msg-input {
  width: 100%;
  min-height: 52px;
  margin: 2px 0 6px;
  padding: 7px 9px;
  border: 0;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  outline: 0;
  resize: vertical;
  font-size: 12.5px;
  line-height: 1.5;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
}
.btn:hover {
  background: var(--hover);
}
.btn.primary {
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: none;
}
.btn.primary:hover {
  filter: brightness(1.15);
}
.btn.sm {
  height: 24px;
  padding: 0 8px;
  font-size: 12px;
}
.btn.block {
  width: 100%;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.link {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--link);
  font-size: 12.5px;
}
.link:hover {
  text-decoration: underline;
}
.side-foot {
  display: flex;
  align-items: center;
  gap: 2px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.account {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 36px;
  padding: 0 6px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
}
.avatar {
  width: 18px;
  height: 18px;
  flex: none;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: var(--selected);
  color: var(--text-2);
  font-size: 10px;
  font-weight: 600;
}
.avatar.ai {
  background: color-mix(in srgb, var(--info) 14%, transparent);
  color: var(--info);
}
.avatar.lj {
  background: color-mix(in srgb, var(--s2) 16%, transparent);
  color: var(--s2);
}

/* Main workspace */
.main-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 8px;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  border-radius: 10px;
  background: var(--canvas);
  box-shadow: 0 0 0 1px var(--line);
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 40px;
  padding: 0 8px;
  border-bottom: 1px solid var(--line);
}
.widget {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
}
.widget:hover {
  background: var(--hover);
}
.widget .sub {
  color: var(--text-3);
  font-weight: 400;
}
.widget svg.i {
  color: var(--text-3);
}
.run-btn {
  color: var(--ok);
}
.stop-btn {
  color: var(--bad);
}
.editor-tabs {
  display: flex;
  align-items: stretch;
  flex: none;
  height: 34px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--sunken);
  border-bottom: 1px solid var(--line);
}
.etab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px 0 12px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--text-3);
  font-size: 12.5px;
  white-space: nowrap;
}
.etab:hover {
  color: var(--text);
}
.etab[aria-current] {
  background: var(--canvas);
  color: var(--text);
  box-shadow: inset 0 -1px 0 var(--canvas), inset 0 2px 0 var(--accent);
}
.etab .x {
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  opacity: 0;
}
.etab[aria-current] .x,
.etab:hover .x {
  opacity: 0.7;
}
.etab .x:hover {
  background: var(--hover);
}
.etab .mod {
  width: 7px;
  height: 7px;
  margin: 0 5px;
  border-radius: 50%;
  background: var(--text-3);
}
.etab svg.i {
  color: var(--text-3);
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
  height: 28px;
  padding: 0 8px 0 14px;
  color: var(--text-3);
  font-size: 12px;
}
.workbench {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.editor {
  flex: 1;
  min-height: 0;
  overflow: auto;
  position: relative;
}
.code {
  padding: 2px 0 60px;
  font: 12.5px/1.7 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
}
.ln {
  display: flex;
}
.ln .no {
  position: relative;
  width: 56px;
  flex: none;
  padding-right: 16px;
  text-align: right;
  color: var(--text-4);
  user-select: none;
}
.ln.cur {
  background: var(--hover);
}
.ln.cur .no {
  color: var(--text-2);
}
.ln.add .no::after,
.ln.mod .no::after {
  content: '';
  position: absolute;
  right: 5px;
  top: 2px;
  bottom: 2px;
  width: 3px;
  background: var(--git-a);
}
.ln.mod .no::after {
  background: var(--git-m);
}
.ln .tx {
  white-space: pre;
  padding-right: 24px;
}
.ln.dadd {
  background: var(--add-bg);
}
.ln.ddel {
  background: var(--del-bg);
}
.ln .wavy {
  text-decoration: underline wavy var(--warn);
  text-underline-offset: 3px;
}
.tk-kw {
  color: var(--code-kw);
}
.tk-str {
  color: var(--code-str);
}
.tk-num {
  color: var(--code-num);
}
.tk-com {
  color: var(--code-com);
  font-style: italic;
}
.inline-chat {
  margin: 4px 24px 6px 56px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font: 12.5px/1.5 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
}
.inline-chat .q {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
}
.inline-chat .a {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-top: 1px solid var(--line);
}
.codelens {
  height: 18px;
  padding-left: 56px;
  font: 11.5px 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
  color: var(--text-3);
}
.codelens button {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--text-3);
}
.codelens button:hover {
  color: var(--link);
  text-decoration: underline;
}

/* Panel and status bar */
.panel {
  flex: none;
  display: flex;
  flex-direction: column;
  height: 220px;
  border-top: 1px solid var(--line);
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 32px;
  padding: 0 6px 0 6px;
}
.ptab {
  position: relative;
  height: 32px;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
}
.ptab:hover {
  color: var(--text);
}
.ptab[aria-current] {
  color: var(--text);
  font-weight: 500;
}
.ptab[aria-current]::after {
  content: '';
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 3px;
  height: 1.5px;
  background: var(--accent);
}
.ptab .n {
  display: inline-grid;
  place-items: center;
  min-width: 16px;
  height: 16px;
  margin-left: 4px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--selected);
  font-size: 10.5px;
  font-weight: 500;
}
.panel-body {
  flex: 1;
  min-height: 0;
  display: flex;
}
.panel-list {
  width: 200px;
  flex: none;
  overflow: auto;
  padding: 2px 6px;
  border-right: 1px solid var(--line);
}
.console {
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: 2px 14px 12px;
  font: 12px/1.65 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
  white-space: pre-wrap;
}
.console .err {
  color: var(--bad);
}
.console a {
  color: var(--link);
  cursor: pointer;
  text-decoration: underline;
}
.statusbar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 24px;
  padding: 0 6px;
  border-top: 1px solid var(--line);
  background: var(--sunken);
  font-size: 11.5px;
  color: var(--text-2);
}
.sb {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  white-space: nowrap;
}
.sb:hover {
  background: var(--hover);
  color: var(--text);
}
.sb.live {
  color: var(--info);
}

/* Tables */
.grid-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.grid-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  height: 30px;
  padding: 0 10px;
  background: var(--canvas);
  border-bottom: 1px solid var(--line-strong);
  color: var(--text-3);
  font-size: 12px;
  font-weight: 500;
  text-align: left;
  white-space: nowrap;
}
.grid-table thead tr:first-child th.grp {
  height: 22px;
  border-bottom: 0;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-4);
}
.grid-table thead tr + tr th {
  top: 22px;
}
.grid-table td {
  height: 30px;
  padding: 0 10px;
  border-bottom: 1px solid var(--line);
  color: var(--text-2);
  white-space: nowrap;
}
.grid-table tr.r:hover td {
  background: var(--hover);
}
.grid-table tr.r.sel td {
  background: var(--focus-row);
}
.grid-table td:first-child,
.grid-table th:first-child {
  padding-left: 14px;
}
.grid-table .num {
  text-align: right;
}
.grid-table .best {
  color: var(--text);
  font-weight: 650;
}
.grid-table .sep {
  border-left: 1px solid var(--line);
}
.grid-table .nm {
  color: var(--text);
}
.grid-table tr.grp-row td {
  height: 28px;
  background: var(--sunken);
  font-size: 12px;
  cursor: pointer;
}
.hist {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  height: 16px;
  margin: 2px 0 4px;
}
.hist i {
  width: 6px;
  background: color-mix(in srgb, var(--s1) 55%, transparent);
}
.check {
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: var(--accent);
}
.progress {
  display: inline-block;
  width: 56px;
  height: 4px;
  border-radius: 2px;
  background: var(--selected);
  overflow: hidden;
  vertical-align: middle;
}
.progress i {
  display: block;
  height: 100%;
  background: var(--info);
}
.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ver {
  font: 12px 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.ver em {
  font-style: normal;
  color: var(--warn);
}
.subbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  height: 38px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
}
.seg {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border-radius: 7px;
  background: var(--hover);
}
.seg button {
  height: 22px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
}
.seg button[aria-pressed='true'] {
  background: var(--canvas);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.05);
}
.filter {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 240px;
  height: 26px;
  padding: 0 8px;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}
.filter input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 12px;
}
.pane-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.pane {
  min-width: 0;
  padding: 12px 16px 10px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.pane:nth-child(2n) {
  border-right: 0;
}
.pane-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  font-size: 12px;
  font-weight: 600;
}
.chart svg {
  display: block;
  width: 100%;
  overflow: visible;
}
.chart .grid line {
  stroke: var(--line);
}
.chart .axis text {
  fill: var(--text-3);
  font-size: 11px;
}
.chart .label {
  fill: var(--text-2);
  font-size: 11px;
}
.chart .hover-line {
  stroke: var(--text-4);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 4px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.legend button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 7px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
}
.legend button:hover {
  background: var(--hover);
}
.legend button.off {
  color: var(--text-4);
}
.legend i {
  width: 12px;
  height: 2px;
  border-radius: 1px;
}
.legend button.off i {
  background: var(--text-4) !important;
}
.tooltip {
  position: fixed;
  z-index: 100;
  min-width: 140px;
  padding: 7px 10px;
  border-radius: 7px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12px;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.tooltip b {
  display: block;
  margin-bottom: 3px;
  font-weight: 600;
}
.tooltip div {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tooltip div span:last-child {
  margin-left: auto;
  padding-left: 12px;
}
.tooltip i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* Documents inside editors */
.doc {
  max-width: 1000px;
  padding: 16px 24px 40px;
}
.doc-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.doc-head h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}
.doc h2 {
  margin: 20px 0 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.kv {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  gap: 5px 14px;
  margin: 0;
  font-size: 12.5px;
}
.kv dt {
  color: var(--text-3);
}
.kv dd {
  margin: 0;
}
.subnav {
  display: flex;
  gap: 2px;
  margin-top: 10px;
  border-bottom: 1px solid var(--line);
}
.subnav button {
  position: relative;
  height: 32px;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--text-3);
}
.subnav button[aria-current] {
  color: var(--text);
  font-weight: 500;
}
.subnav button[aria-current]::after {
  content: '';
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 2px;
  background: var(--accent);
}
.note-area {
  width: 100%;
  min-height: 60px;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: var(--sunken);
  box-shadow: inset 0 0 0 1px var(--line);
  outline: 0;
  resize: vertical;
  line-height: 1.6;
}
.alert {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-left: 3px solid var(--bad);
  background: color-mix(in srgb, var(--bad) 7%, transparent);
  font-size: 12.5px;
}
.welcome-head {
  padding: 64px 56px 28px;
}
.welcome-head h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.welcome {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 340px);
  gap: 56px;
  padding: 0 56px 40px;
}
.welcome h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.welcome h2 {
  margin: 26px 0 6px;
  font-size: 14px;
  font-weight: 600;
}
.welcome .lk {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--link);
  font-size: 13px;
}
.welcome .lk:hover {
  text-decoration: underline;
}
.welcome .recent {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 26px;
  font-size: 13px;
  white-space: nowrap;
}
.welcome .recent .muted {
  overflow: hidden;
  text-overflow: ellipsis;
}
.welcome .recent .muted {
  font-size: 12px;
}

/* Notebook */
.nb-bar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 34px;
  padding: 0 10px;
  border-bottom: 1px solid var(--line);
}
.cell {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  margin-right: 20px;
  padding: 6px 0;
}
.cell .gutter {
  padding: 8px 10px 0 0;
  text-align: right;
  font: 11.5px 'Cascadia Code', Consolas, monospace;
  color: var(--text-4);
}
.cell .src {
  border-radius: 6px;
  background: var(--sunken);
  box-shadow: inset 0 0 0 1px var(--line);
  padding: 8px 12px;
  font: 12.5px/1.65 'Cascadia Code', Consolas, monospace;
  white-space: pre;
  overflow-x: auto;
}
.cell.md .src {
  background: transparent;
  box-shadow: none;
  font: 13px/1.6 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
  white-space: normal;
}
.cell.md h3 {
  margin: 4px 0;
  font-size: 15px;
}
.cell.active .src {
  box-shadow: inset 0 0 0 1px var(--info);
}
.cell .out {
  grid-column: 2;
  margin-top: 6px;
  padding: 2px 12px;
  font: 12px/1.6 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.cell .out table {
  border-collapse: collapse;
  font-size: 12px;
}
.cell .out th,
.cell .out td {
  padding: 3px 14px 3px 0;
  border-bottom: 1px solid var(--line);
  text-align: right;
}
.cell .out th {
  color: var(--text-3);
  font-weight: 500;
}

/* Git graph */
.log-row {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 90px 80px 76px;
  align-items: center;
  min-height: 32px;
  padding-right: 14px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  cursor: default;
}
.log-row:hover {
  background: var(--hover);
}
.log-row.sel {
  background: var(--focus-row);
}
.log-row .rail {
  position: relative;
  align-self: stretch;
}
.log-row .rail::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--s1);
}
.log-row .rail.side::after {
  content: '';
  position: absolute;
  left: 31px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--s2);
}
.log-row .rail.first::before {
  top: 16px;
}
.log-row .rail i {
  position: absolute;
  left: 15px;
  top: 11px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--canvas);
  box-shadow: inset 0 0 0 2px var(--s1);
}
.log-row .rail i.b {
  left: 27px;
  box-shadow: inset 0 0 0 2px var(--s2);
}
.log-row .msg {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}
.log-detail {
  padding: 10px 16px 12px 58px;
  border-bottom: 1px solid var(--line);
  background: var(--sunken);
  font-size: 12.5px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  padding: 0 6px;
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  font: 11px 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.tag.run {
  box-shadow: none;
  background: var(--selected);
  font-family: inherit;
  cursor: pointer;
}
.diff2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  font: 12.5px/1.7 'Cascadia Code', Consolas, monospace;
}
.diff2 > div + div {
  border-left: 1px solid var(--line);
}

/* Overlays */
.quick {
  position: fixed;
  left: 50%;
  top: 52px;
  z-index: 60;
  width: 580px;
  transform: translateX(-50%);
  border-radius: 9px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
.quick .qin {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  margin: 6px;
  padding: 0 10px;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1.5px var(--accent);
  color: var(--text-3);
}
.quick .qin input {
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
}
.quick .ql {
  padding: 6px 14px 2px;
  font-size: 11.5px;
  color: var(--text-3);
}
.quick .qi {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 30px;
  padding: 4px 14px;
  border: 0;
  background: transparent;
  text-align: left;
}
.quick .qi:hover {
  background: var(--focus-row);
}
.quick .qi small {
  margin-left: auto;
  color: var(--text-3);
  font-size: 12px;
}
.quick .qi .mono {
  font-size: 11.5px;
  color: var(--text-3);
}
.quick .list {
  max-height: 380px;
  overflow: auto;
  padding-bottom: 6px;
}
.quick-scrim {
  position: fixed;
  inset: 0;
  z-index: 55;
}
.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: start center;
  padding-top: 10vh;
  background: rgba(12, 12, 14, 0.24);
}
.dialog {
  width: 560px;
  border-radius: 10px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.dialog-head {
  display: flex;
  align-items: center;
  padding: 14px 12px 4px 20px;
  font-size: 15px;
  font-weight: 600;
}
.dialog-body {
  padding: 10px 20px;
}
.dialog-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px 14px 20px;
  font-size: 12.5px;
}
.form-row {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 12.5px;
}
.form-row > label {
  color: var(--text-2);
}
.field {
  width: 100%;
  height: 28px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  outline: 0;
}
.field:focus {
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
.ptable {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.ptable th {
  padding: 4px 6px 4px 0;
  border-bottom: 1px solid var(--line-strong);
  color: var(--text-3);
  font-weight: 500;
  font-size: 12px;
  text-align: left;
}
.ptable td {
  padding: 4px 6px 4px 0;
  border-bottom: 1px solid var(--line);
}
.ptable td:first-child {
  width: 80px;
  font: 12px 'Cascadia Code', Consolas, monospace;
}
.ptable .field {
  height: 26px;
  font: 12px 'Cascadia Code', Consolas, monospace;
}
.menu {
  position: fixed;
  z-index: 60;
  min-width: 230px;
  padding: 4px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.menu button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  text-align: left;
  font-size: 12.5px;
}
.menu button:hover {
  background: var(--focus-row);
}
.menu button kbd {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-3);
}
.menu hr {
  height: 1px;
  margin: 4px 6px;
  border: 0;
  background: var(--line);
}
.menu .ml {
  padding: 5px 10px 2px;
  font-size: 11.5px;
  color: var(--text-3);
}
.toast {
  position: fixed;
  right: 24px;
  bottom: 60px;
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 440px;
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12.5px;
}
.toast svg.i {
  color: var(--info);
}

/* AI dock */
.dock {
  width: 340px;
  flex: none;
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  background: var(--canvas);
  box-shadow: 0 0 0 1px var(--line);
  overflow: hidden;
}
.dock-head {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 40px;
  padding: 0 6px 0 12px;
  border-bottom: 1px solid var(--line);
}
.dock-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 13px;
  line-height: 1.65;
}
.msg.me {
  align-self: flex-end;
  max-width: 90%;
  padding: 7px 11px;
  border-radius: 10px;
  background: var(--selected);
}
.ctx {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: 4px;
  background: var(--hover);
  font-size: 11.5px;
  color: var(--text-2);
}
.codeblock {
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  overflow: hidden;
  font: 12px/1.65 'Cascadia Code', Consolas, monospace;
}
.codeblock .h {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 4px 0 10px;
  border-bottom: 1px solid var(--line);
  background: var(--sunken);
  font: 12px 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
}
.codeblock .a,
.codeblock .d {
  padding: 0 10px;
  white-space: pre;
}
.codeblock .a {
  background: var(--add-bg);
  color: var(--git-a);
}
.codeblock .d {
  background: var(--del-bg);
  color: var(--git-d);
}
.composer {
  margin: 10px;
  padding: 9px 11px;
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}

/* Prototype controls and notes */
.proto {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 9px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12px;
}
.proto strong {
  padding: 0 8px;
  font-weight: 600;
}
.proto .btn {
  height: 24px;
  padding: 0 8px;
  font-size: 12px;
  box-shadow: none;
  font-weight: 400;
}
.proto .btn[aria-pressed='true'] {
  background: var(--note);
  color: #fff;
}
.note-badge {
  position: fixed;
  z-index: 85;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--note);
  color: #fff;
  font: 600 11px 'Segoe UI', sans-serif;
  box-shadow: 0 0 0 2px var(--canvas);
  pointer-events: none;
}
.note-outline {
  position: fixed;
  z-index: 69;
  border: 1.5px dashed color-mix(in srgb, var(--note) 70%, transparent);
  border-radius: 6px;
  pointer-events: none;
}
.notes {
  position: fixed;
  right: 16px;
  bottom: 56px;
  z-index: 80;
  width: 380px;
  max-height: 68vh;
  overflow: auto;
  padding: 12px 16px;
  border-radius: 10px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.notes h3 {
  margin: 0 0 6px;
  font-size: 13px;
}
.notes ol {
  margin: 0;
  padding: 0;
  list-style: none;
}
.notes li {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 10px;
  padding: 7px 0;
  border-top: 1px solid var(--line);
  font-size: 12.5px;
  line-height: 1.55;
}
.notes li b {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--note);
  color: #fff;

  // ---------- Editor ----------
  function editorPane() {
    const tabs = S.tabs.map((p) => `<button class="etab" data-act="tab" data-path="${p}" ${S.active === p ? 'aria-current="true"' : ''}>${icon(p.endsWith('.bib') ? 'quote' : p.endsWith('.png') ? 'image' : p.endsWith('.pdf') ? 'pdf' : 'file', 14)}<span>${esc(base(p))}</span><span class="x" data-act="close-tab" data-path="${p}">${icon('x', 12)}</span></button>`).join('');

      const lang = ext(p);
      const cmts = S.comments.filter((c) => !c.resolved && c.file === p);
      body = `<div class="editor" data-scroll="ed-${p}" data-note="5"><div class="code tex">${lines(p).map((l, i) => {

        let html = `<div class="ln ${cls}" data-act="cursor" data-line="${n}"><span class="no">${err ? `<span class="gut-err" title="${esc(err.text)}">${icon('error', 11)}</span>` : c ? `<span class="gut-cmt" title="${esc(c.by)}：${esc(c.text)}">${icon('comment', 11)}</span>` : ''}${n}</span><span class="tx">${highlight(l, lang) || ' '}</span></div>`;
        if (S.cite && S.cite.file === p && S.cite.line === n) html += citePopup();

        return html;
      }).join('')}</div></div>`;
    }
    const tools = p.endsWith('.tex')

        <button class="ib sm" title="插入图" data-act="dialog" data-kind="figure">${icon('image', 14)}</button><button class="ib sm" title="插入表" data-act="dialog" data-kind="table">${icon('table', 14)}</button><button class="ib sm" title="引用" data-act="cite-open" data-key="">${icon('quote', 14)}</button><button class="ib sm" title="交叉引用" data-act="menu" data-kind="ref">${icon('link', 14)}</button><button class="ib sm" title="公式" data-act="toast" data-text="已插入 equation 环境">${icon('sigma', 14)}</button><button class="ib sm" title="符号" data-act="menu" data-kind="symbols">${icon('omega', 14)}</button><span class="tsep"></span>
        <button class="ib sm" title="批注 (Ctrl+Shift+C)" data-act="toast" data-text="选中文字后写批注">${icon('comment', 14)}</button>

      : '';

  function citePopup() {

  function inlineAi() {
    return `<div class="inline-chat"><div class="q">${icon('sparkles', 14)}<span style="flex:1">这句结论说得太满，改得克制一些，并说明只有一个随机种子</span><span class="muted" style="font-size:12px">第 22–23 行</span></div></div>
      <div class="ln ddel"><span class="no">−</span><span class="tx">Removing the state context hurts most, which supports our hypothesis</span></div>
      <div class="ln dadd"><span class="no">+</span><span class="tx">Removing the state context hurts most. With a single seed, this is consistent</span></div>

  // ---------- PDF ----------
  function pipeline(w = 300) {
    return `<svg viewBox="0 0 300 90" width="${w}" style="display:block;margin:auto"><rect x="4" y="30" width="70" height="30" rx="4" fill="none" stroke="#333"/><text x="39" y="49" font-size="9" text-anchor="middle">Stream</text><path d="M74 45h30" stroke="#333" marker-end="url(#a)"/><rect x="106" y="22" width="86" height="46" rx="4" fill="#eef3fb" stroke="#2a78d6"/><text x="149" y="42" font-size="9" text-anchor="middle">Decision model</text><text x="149" y="55" font-size="7.5" text-anchor="middle" fill="#666">when to speak</text><path d="M192 45h30" stroke="#333" marker-end="url(#a)"/><rect x="224" y="22" width="72" height="46" rx="4" fill="#fdf1ea" stroke="#eb6834"/><text x="260" y="42" font-size="9" text-anchor="middle">Response</text><text x="260" y="55" font-size="7.5" text-anchor="middle" fill="#666">what to say</text><defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 6 3 0 6z" fill="#333"/></marker></defs></svg>`;
  }
  function barChart(w = 260) {
    const bars = [['Full', 0.684, '#2a78d6'], ['w/o audio', 0.651, '#eb6834'], ['w/o state', 0.623, '#1baf7a']];
    return `<svg viewBox="0 0 260 120" width="${w}" style="display:block;margin:auto"><line x1="30" y1="100" x2="250" y2="100" stroke="#999"/>${bars.map(([l, v, c], i) => `<rect x="${50 + i * 70}" y="${100 - (v - 0.5) * 400}" width="36" height="${(v - 0.5) * 400}" rx="2" fill="${c}"/><text x="${68 + i * 70}" y="112" font-size="8" text-anchor="middle">${l}</text><text x="${68 + i * 70}" y="${95 - (v - 0.5) * 400}" font-size="8" text-anchor="middle">${v}</text>`).join('')}<text x="12" y="60" font-size="8" transform="rotate(-90 12 60)" text-anchor="middle">F1</text></svg>`;
  }
  const cite = (k) => {
    const i = ['yang2025proactive', 'lu2024proactive', 'zhang2025ovo', 'wang2024streaming', 'xu2025proagent', 'liu2025prism'].indexOf(k);
    return S.bib.includes(k) ? `<span class="pdf-cite">[${i + 1}]</span>` : `<span class="pdf-cite missing">[?]</span>`;
  };
  const para = (src, html) => `<p data-act="synctex" data-src="${src}" class="${S.flash === src ? 'flash' : ''}">${html}</p>`;
  function pdfPages() {
    const z = S.zoom / 100;
    const p1 = `<div class="page" style="--z:${z}"><div class="page-in">
      <h1 class="${S.flash === 'main.tex:8' ? 'flash' : ''}" data-act="synctex" data-src="main.tex:8">Knowing When to Speak: Timing Models for Proactive Assistants</h1>
      <div class="authors">Zihe Pan · Jia Li · Qingyu Lab</div>
      <div class="abstract"><b>Abstract</b>${para('main.tex:15', 'Proactive assistants must decide not only what to say but when to say it. We separate the timing decision from response generation and train a lightweight timing model on a continuous observation stream. On OVO-Bench it lowers false triggers by 31% at equal recall.')}</div>
      <h2 class="${S.flash === 'sections/intro.tex:1' ? 'flash' : ''}">1&nbsp;&nbsp;Introduction</h2>
      ${para('sections/intro.tex:4', `Assistants that act before being asked can save time, but an assistant that speaks at the wrong moment is worse than one that stays silent ${cite('yang2025proactive')}. Existing proactive agents fold the timing decision into the language model ${cite('lu2024proactive')}, which makes every observation step expensive and false triggers frequent.`)}
      ${para('sections/intro.tex:10', 'We split the problem in two: a decision model answers whether and when to intervene, and a response model answers what to say. Figure 1 shows the pipeline.')}
      <figure data-act="synctex" data-src="sections/intro.tex:16">${pipeline(300)}<figcaption>Figure 1: The decision model watches the stream; the response model speaks.</figcaption></figure>
      <h2 class="${S.flash === 'sections/related.tex:1' ? 'flash' : ''}">2&nbsp;&nbsp;Related Work</h2>
      ${para('sections/related.tex:4', `Streaming video understanding has moved from offline clips to online benchmarks ${cite('zhang2025ovo')}. Proactive dialogue systems learn when to take the initiative from human traces ${cite('lu2024proactive')}.`)}
      <div class="page-no">1</div></div></div>`;
    const p2 = `<div class="page" style="--z:${z}"><div class="page-in">
      <h2 class="${S.flash === 'sections/method.tex:1' ? 'flash' : ''}">3&nbsp;&nbsp;Method</h2>
      <h3>3.1&nbsp;&nbsp;Decision model</h3>
      ${para('sections/method.tex:5', 'At each step <i>t</i> the decision model reads the observation window <i>o</i><sub>t−w:t</sub> and the state context <i>s</i><sub>t</sub> and outputs <i>p</i>(speak | <i>o</i>, <i>s</i>).')}
      <h3>3.2&nbsp;&nbsp;Response model</h3>
      ${para('sections/method.tex:9', 'When the decision model fires, the response model generates the reply conditioned on the same window.')}
      <h2 class="${S.flash === 'sections/experiments.tex:1' ? 'flash' : ''}">4&nbsp;&nbsp;Experiments</h2>
      ${para('sections/experiments.tex:4', `We evaluate on OVO-Bench ${cite('zhang2025ovo')} and ProactiveBench ${cite('lu2024proactive')}. Table 1 reports the ablation.`)}
      <div class="pdf-table ${S.flash === 'sections/experiments.tex:11' ? 'flash' : ''}" data-act="synctex" data-src="sections/experiments.tex:11"><div class="cap">Table 1: Ablation of the timing model (seed 0).</div><table><tr><th>Setting</th><th>F1 ↑</th><th>False trigger ↓</th><th>Latency</th></tr><tr><td>Full model</td><td><b>0.684</b></td><td><b>12.4%</b></td><td>0.82s</td></tr><tr><td>w/o audio</td><td>0.651</td><td>15.1%</td><td>${S.fixed ? '' : '<span class="tex-err">cmark</span> '}0.61s</td></tr><tr><td>w/o state</td><td>0.623</td><td>17.9%</td><td>0.79s</td></tr></table></div>
      ${para('sections/experiments.tex:22', `Removing the state context hurts most${S.accepted ? '. With a single seed, this is consistent with, but does not yet establish, our hypothesis' : ', which supports our hypothesis'} that state suppresses false triggers ${cite('wang2024streaming')}.`)}
      <h2>References</h2>
      <ol class="refs">${['yang2025proactive', 'lu2024proactive', 'zhang2025ovo', 'wang2024streaming', 'xu2025proagent', 'liu2025prism'].filter((k) => S.bib.includes(k) && S.cited.includes(k)).map((k) => { const x = LIBRARY.find((y) => y.key === k); return `<li>${esc(x.who)} ${esc(x.title)}. ${x.year}.</li>`; }).join('')}</ol>
      <div class="page-no">2</div></div></div>`;
    return p1 + p2;
  }
  function logView() {

    return `<div class="log-pane" data-note="8"><div class="log-head"><b>日志</b><span class="muted">${S.fixed ? '编译成功' : '编译完成，有错误'} · 2.1 秒 · pdfLaTeX · TeX Live 2025</span><span class="spacer"></span><button class="btn sm" data-act="logs">${icon('pdf', 12)}返回 PDF</button></div>
      ${e.length ? `<div class="log-group">错误 <span class="n bad">${e.length}</span></div>${e.map(item).join('')}` : ''}

      <button class="row" data-act="toast" data-text="输出文件：main.aux、main.bbl、main.blg、main.synctex.gz">${icon('files', 13)}<span class="name">其他输出文件</span><span class="end">aux · bbl · blg</span></button>

  function notesPanel() {

  function placeBadges() {
    document.querySelectorAll('.note-badge,.note-outline').forEach((n) => n.remove());
    if (!S.annotate) return;
    const seen = new Set();
    for (const el of document.querySelectorAll('[data-note]')) {
      const n = +el.dataset.note;
      if (seen.has(n)) continue;
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      seen.add(n);
      const o = document.createElement('div');
      o.className = 'note-outline';
      Object.assign(o.style, { left: r.left - 2 + 'px', top: r.top - 2 + 'px', width: r.width + 4 + 'px', height: Math.min(r.height, window.innerHeight - r.top - 4) + 4 + 'px' });
      const b = document.createElement('div');
      b.className = 'note-badge';
      b.textContent = n;
      Object.assign(b.style, { left: r.left - 9 + 'px', top: r.top - 9 + 'px' });
      document.body.append(o, b);
    }
  }

  // ---------- Render ----------
  function render() {
    const scrolls = {};
    document.querySelectorAll('[data-scroll]').forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
    const focused = document.activeElement?.dataset?.input;
    document.getElementById('root').innerHTML = `<div class="app" data-theme="${S.theme}">
      ${titlebar()}
      <div class="body">${sidebar()}<div class="main-wrap"><main class="main">${toolbar()}<div class="workbench">${workbench()}</div>${statusbar()}</main>${dock()}</div></div>

      <div class="proto"><strong>写作 · 原型</strong><button class="btn" data-act="annotate" aria-pressed="${S.annotate}">标注</button><button class="btn" data-act="theme">${S.theme === 'graphite' ? '夜' : '石墨'}</button><button class="btn" data-act="reset">重置</button></div>
    </div>`;
    document.body.dataset.theme = S.theme;
    document.querySelectorAll('[data-scroll]').forEach((el) => {
      if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll];
    });
    if (S.scrollTo) {
      document.querySelector('.ln.cur')?.scrollIntoView({ block: 'center' });
      S.scrollTo = null;
    }
    if (S.flashScroll) {
      document.querySelector('.pdf-scroll .flash')?.scrollIntoView({ block: 'center' });
      S.flashScroll = false;
    }
    if (focused) {
      const field = document.querySelector(`[data-input="${focused}"]`);
      field?.focus();
      field?.setSelectionRange?.(field.value.length, field.value.length);
    }
    placeBadges();
  }

  // ---------- Actions ----------
  function compile(message) {
    if (S.compiling) return;
    S.compiling = true;
    render();
    setTimeout(() => {
      S.compiling = false;
      S.versions.unshift({ id: 'v' + (S.versions.length + 1), when: '11-15 ' + new Date().toTimeString().slice(0, 5), what: '编译成功', who: '我' });
      toast(message || (errors().length ? `编译完成 · ${errors().length} 个错误，PDF 已尽量生成` : '编译成功 · 2.1 秒'));
      render();
    }, 1100);
  }
  function act(el, ev) {
    const a = el.dataset.act;
    const id = el.dataset.id;
    const close = () => {
      S.menu = null;
      S.quick = null;
    };
    switch (a) {
      case 'noop':
        return;
      case 'view':
        S.view = id;
        break;
      case 'open':
        close();
        open(el.dataset.path);
        break;
      case 'tab':
        if (ev.target.closest('[data-act="close-tab"]')) return;
        S.active = el.dataset.path;
        break;
      case 'close-tab': {
        ev.stopPropagation();
        const i = S.tabs.indexOf(el.dataset.path);
        S.tabs.splice(i, 1);
        if (S.active === el.dataset.path) S.active = S.tabs[Math.max(0, i - 1)] || 'main.tex';
        if (!S.tabs.length) S.tabs = ['main.tex'];
        break;
      }
      case 'goto': {
        if (ev.target.closest('button') && ev.target.closest('button') !== el) return;
        const file = el.dataset.file;
        const line = +el.dataset.line;
        open(file, line);
        if (S.layout === 'source') S.layout = 'split';
        if (S.pane !== 'log') {
          const target = `${file}:${line}`;
          S.flash = document.querySelector(`[data-src="${target}"]`) ? target : `${file}:1`;
          S.flashScroll = true;
        }
        break;
      }
      case 'cursor':
        if (ev.target.closest('[data-act="cite-open"]')) return;
        S.hl = { file: S.active, line: +el.dataset.line };
        break;
      case 'sync-fwd': {
        const line = S.hl?.file === S.active ? S.hl.line : 22;
        const candidates = [...document.querySelectorAll('[data-src]')].map((n) => n.dataset.src).filter((s) => s.startsWith(S.active + ':'));
        const best = candidates.map((s) => [s, Math.abs(+s.split(':')[1] - line)]).sort((x, y) => x[1] - y[1])[0];
        S.flash = best ? best[0] : null;
        S.flashScroll = true;
        if (!best) toast('这个文件在 PDF 里没有对应的位置');
        break;
      }
      case 'synctex': {
        const [file, line] = el.dataset.src.split(':');
        open(file, +line);
        S.flash = el.dataset.src;
        break;
      }
      case 'compile':
        close();
        compile();
        return;
      case 'clean':
        close();
        compile('已清除缓存并重新编译 · 6.4 秒');
        return;
      case 'logs':
        S.pane = S.pane === 'log' ? 'pdf' : 'log';
        if (S.layout === 'source') S.layout = 'split';
        break;
      case 'layout':
        S.layout = id;
        break;
      case 'zoom':
        S.zoom = Math.max(50, Math.min(200, S.zoom + +id));
        break;
      case 'toggle':
        S[id] = !S[id];
        break;
      case 'ms':
        close();
        S.ms = id;
        toast(id === 'thesis' ? '已切换到“学位论文”（XeLaTeX）' : '已切换到 NeurIPS 2026');
        break;
      case 'cite-open': {
        ev.stopPropagation();
        close();
        const lineEl = el.closest('.ln');
        const line = lineEl ? +lineEl.dataset.line : S.hl?.line || 5;
        const file = S.active.endsWith('.tex') ? S.active : 'sections/experiments.tex';
        if (!S.active.endsWith('.tex')) open(file);
        S.cite = { file, line, key: el.dataset.key || '' };
        S.citeQuery = '';
        S.focusCite = true;
        break;
      }
      case 'cite-pick': {
        const k = el.dataset.key;
        const inBib = S.bib.includes(k);
        if (!inBib) S.bib.push(k);
        if (!S.cited.includes(k)) S.cited.push(k);
        S.cite = null;
        toast(inBib ? `已插入 \\cite{${k}}` : `已插入 \\cite{${k}}，并把条目写进 references.bib`);
        break;
      }
      case 'fill-bib': {
        const k = el.dataset.key;
        S.bib.push(k);
        toast(`已从文献库把 ${k} 写进 references.bib`);
        break;
      }
      case 'goto-cite': {
        close();
        const k = el.dataset.key;
        const hit = Object.entries(SRC).find(([, ls]) => ls.some((l) => l.includes(k)));
        if (hit) open(hit[0], hit[1].findIndex((l) => l.includes(k)) + 1);
        break;
      }
      case 'track':
        S.track = el.checked;
        toast(S.track ? '已打开修订：改动会先作为建议显示' : '已关闭修订');
        break;
      case 'resolve': {
        ev.stopPropagation();
        S.comments.find((c) => c.id === id).resolved = true;
        toast('批注已解决');
        break;
      }
      case 'label':
        S.versions[0].label = '投稿版 v2';
        toast('已给当前版本加标签“投稿版 v2”');
        break;
      case 'compare': {
        const v = S.versions.find((x) => x.id === id);
        toast(`和“${v.label || v.when}”对比：experiments.tex 改了 4 行，intro.tex 改了 2 行（差异在新标签里打开）`);
        break;
      }
      case 'inline':
        close();
        open('sections/experiments.tex', 22);
        S.inline = true;
        break;
      case 'inline-accept':
        S.inline = false;
        S.accepted = true;
        SRC['sections/experiments.tex'][21] = 'Removing the state context hurts most. With a single seed, this is consistent';
        SRC['sections/experiments.tex'][22] = 'with, but does not yet establish, our hypothesis \\citep{wang2024streaming}.';
        if (S.auto) compile('已接受修改并重新编译');
        else toast('已接受修改');
        break;
      case 'inline-reject':
        S.inline = false;
        break;
      case 'ai-fix':
        S.dock = true;
        S.ai = 'fix';
        break;
      case 'apply-fix':
        S.fixed = true;
        S.ai = null;
        SRC['sections/experiments.tex'][15] = '    w/o audio & 0.651 & 15.1\\% & 0.61s \\\\';
        compile('已修改 experiments.tex 并重新编译 · 没有错误');
        return;
      case 'dock':
        S.dock = !S.dock;
        if (!S.dock) S.ai = null;
        break;
      case 'menu': {
        ev.stopPropagation();
        const r = el.getBoundingClientRect();
        S.menu = { kind: el.dataset.kind, x: Math.min(r.left, window.innerWidth - 270), y: r.bottom + 4 };
        break;
      }
      case 'quick':
        ev.stopPropagation();
        S.menu = null;
        S.quick = { kind: el.dataset.kind };
        break;
      case 'quick-close':
        S.quick = null;
        break;
      case 'import-ok':
        close();
        toast('已从 Overleaf 导入“ICLR rebuttal”：主文档 main.tex，编译器 pdfLaTeX');
        break;
      case 'dialog':
        close();
        S.dialog = { kind: el.dataset.kind };
        break;
      case 'dialog-close':
        S.dialog = null;
        break;
      case 'scrim':
        if (ev.target !== el) return;
        S.dialog = null;
        break;
      case 'new-ok':
        S.dialog = null;
        toast('已用 ICML 2026 模板新建稿件，并完成第一次编译');
        break;
      case 'figure-ok':
        S.dialog = null;
        SRC['sections/experiments.tex'].push('', '\\begin{figure}[t]', '  \\centering', '  \\includegraphics[width=\\linewidth]{figures/pr_curve.png}', '  \\caption{Precision--recall of the timing model.}', '  \\label{fig:pr}', '\\end{figure}');
        open('sections/experiments.tex', SRC['sections/experiments.tex'].length - 3);
        toast('已插入图，pr_curve.png 已复制到 figures/');
        break;
      case 'table-ok':
        S.dialog = null;
        toast('已插入 3 × 4 的 tabular');
        break;
      case 'annotate':
        S.annotate = !S.annotate;
        break;
      case 'theme':
        S.theme = S.theme === 'graphite' ? 'night' : 'graphite';
        break;
      case 'reset':
        location.reload();
        return;
      case 'toast':
        ev.stopPropagation();
        close();
        toast(el.dataset.text);
        break;
      default:
        return;
    }
    if (!['menu', 'quick'].includes(a) && !el.closest('.menu') && !el.closest('.quick')) S.menu = null;
    render();
    if (S.focusCite) {
      S.focusCite = false;
      document.querySelector('[data-input="cite"]')?.focus();
    }
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) {
      if (S.menu || S.cite) {
        S.menu = null;
        if (!ev.target.closest('.cite-pop')) S.cite = null;
        render();
      }
      return;
    }
    if (el.disabled) return;
    if (el.dataset.act === 'synctex' && ev.detail < 2) return;
    act(el, ev);
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.dataset.input === 'cite') {
      S.citeQuery = ev.target.value;
      render();
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (S.cite) S.cite = null;
      else if (S.quick) S.quick = null;
      else if (S.menu) S.menu = null;
      else if (S.dialog) S.dialog = null;
      else if (S.inline) S.inline = false;
      else return;
      render();
      return;
    }
    const mod = ev.ctrlKey || ev.metaKey;
    if (mod && (ev.key === 'Enter' || ev.key.toLowerCase() === 's')) {
      ev.preventDefault();
      compile(ev.key === 'Enter' ? undefined : '已保存并重新编译');
    } else if (mod && ev.key.toLowerCase() === 'p') {
      ev.preventDefault();
      S.quick = { kind: 'files' };
      render();
    }
  });
  window.addEventListener('resize', placeBadges);
  render();
})();

</script>
</body>
</html>
