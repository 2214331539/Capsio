<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsio · 实验页原型</title>
<style>
/* Capsio experiment workspace prototype: an IDE layout inside the app shell. */
:root,
[data-theme='graphite'] {
  --chrome: #f4f4f5;
  --canvas: #ffffff;
  --raised: #ffffff;
  --sunken: #fafafa;
  --hover: rgba(24, 24, 27, 0.045);
  --selected: rgba(24, 24, 27, 0.075);
  --focus-row: rgba(59, 91, 219, 0.1);
  --line: rgba(24, 24, 27, 0.08);
  --line-strong: rgba(24, 24, 27, 0.15);
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #71717a;
  --text-4: #a1a1aa;
  --accent: #18181b;
  --on-accent: #ffffff;
  --link: #2f5bd3;
  --ok: #2f7d4f;
  --warn: #a5650e;
  --bad: #c0392b;
  --info: #3b5bdb;
  --git-m: #a5650e;
  --git-a: #2f7d4f;
  --git-d: #c0392b;
  --add-bg: rgba(47, 125, 79, 0.09);
  --del-bg: rgba(192, 57, 43, 0.08);
  --shadow-pop: 0 0 0 1px rgba(0, 0, 0, 0.07), 0 10px 32px rgba(0, 0, 0, 0.12);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --code-kw: #7c3aed;
  --code-str: #2f7d4f;
  --code-num: #b45309;
  --code-com: #8b8b93;
  --note: #e8590c;
  color-scheme: light;
}
[data-theme='night'] {
  --chrome: #0e0e10;
  --canvas: #151517;
  --raised: #1c1c1f;
  --sunken: #121214;
  --hover: rgba(255, 255, 255, 0.05);
  --selected: rgba(255, 255, 255, 0.085);
  --focus-row: rgba(123, 147, 240, 0.16);
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #ededef;
  --text-2: #a3a3ab;
  --text-3: #85858e;
  --text-4: #5b5b63;
  --accent: #ededef;
  --on-accent: #111113;
  --link: #8aa4ff;
  --ok: #4fae73;
  --warn: #d49a3a;
  --bad: #e5675a;
  --info: #7b93f0;
  --git-m: #d49a3a;
  --git-a: #4fae73;
  --git-d: #e5675a;
  --add-bg: rgba(79, 174, 115, 0.11);
  --del-bg: rgba(229, 103, 90, 0.11);
  --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 10px 32px rgba(0, 0, 0, 0.5);
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #008300;
  --code-kw: #b197fc;
  --code-str: #69db7c;
  --code-num: #ffa94d;
  --code-com: #6f6f78;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  font: 13px/1.5 'Segoe UI Variable Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', system-ui, sans-serif;
  color: var(--text);
  background: var(--chrome);
  -webkit-font-smoothing: antialiased;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
svg.i {
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mono {
  font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
}
.muted {
  color: var(--text-3);
}
.spacer {
  flex: 1;
}

/* Shell */
.app {
  display: grid;
  grid-template-rows: 44px minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
  min-width: 1100px;
  min-height: 680px;
}
.titlebar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  padding: 0 8px 0 12px;
}
.logo {
  width: 18px;
  height: 18px;
  margin-right: 8px;
}
.ib {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  min-width: 28px;
  padding: 0 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  white-space: nowrap;
}
.ib:hover {
  background: var(--hover);
  color: var(--text);
}
.ib[aria-pressed='true'] {
  background: var(--selected);
  color: var(--text);
}
.ib:disabled {
  opacity: 0.4;
  cursor: default;
  background: transparent;
}
.ib.sm {
  height: 22px;
  min-width: 22px;
  padding: 0 3px;
}
.crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 6px;
  color: var(--text-3);
}
.crumbs b {
  color: var(--text);
  font-weight: 500;
}
.tb-search {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  width: 400px;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 7px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text-3);
  text-align: left;
}
.tb-search kbd {
  margin-left: auto;
  font-size: 11px;
}
.tb-sep {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: var(--line-strong);
}
.body {
  display: flex;
  min-width: 0;
  min-height: 0;
  padding: 0 8px 8px 0;
}

/* Sidebar */
.sidebar {
  width: 248px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 6px 8px 8px;
}
.uplink {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 26px;
  padding: 0 8px 0 4px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
}
.switcher {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  margin: 2px 0 6px;
  padding: 6px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
}
.mark {
  width: 18px;
  height: 24px;
  flex: none;
  border-radius: 2px 4px 4px 2px;
  background: #4f5866;
  box-shadow: inset 3px 0 0 rgba(0, 0, 0, 0.22);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  height: 30px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  text-align: left;
}
.nav-item:hover {
  background: var(--hover);
  color: var(--text);
}
.nav-item[aria-current] {
  background: var(--selected);
  color: var(--text);
  font-weight: 500;
}
.views {
  display: flex;
  gap: 2px;
  margin-top: 10px;
  padding: 8px 0 6px;
  border-top: 1px solid var(--line);
}
.views .ib {
  position: relative;
  flex: 1;
  height: 30px;
}
.views .ib[aria-pressed='true'] {
  color: var(--text);
}
.views .ib[aria-pressed='true']::after {
  content: '';
  position: absolute;
  left: 28%;
  right: 28%;
  bottom: -3px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.views .badge {
  position: absolute;
  top: 0;
  right: 4px;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--info);
  color: #fff;
  font: 600 10px/15px 'Segoe UI', sans-serif;
}
.view-title {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 28px;
  padding: 0 2px 0 6px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-3);
}
.view {
  flex: 1;
  min-height: 0;
  overflow: auto;
  margin: 0 -8px;
  padding: 0 8px 8px;
}
.sec {
  margin-top: 4px;
}
.sec-head {
  display: flex;
  align-items: center;
  gap: 2px;
  width: 100%;
  height: 24px;
  padding: 0 2px 0 2px;
  border: 0;
  background: transparent;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-2);
  text-align: left;
}
.sec-head .t {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 4px;
}
.sec-head .n {
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: 8px;
  background: var(--selected);
  font-size: 10.5px;
  font-weight: 500;
  line-height: 16px;
  color: var(--text-2);
}
.sec-head .acts {
  display: none;
}
.sec:hover .sec-head .acts {
  display: inline-flex;
}
.row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  height: 24px;
  padding: 0 6px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
  font-size: 12.5px;
  text-align: left;
  white-space: nowrap;
}
.row:hover {
  background: var(--hover);
  color: var(--text);
}
.row[aria-current] {
  background: var(--focus-row);
  color: var(--text);
}
.row .name {
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .dir {
  color: var(--text-4);
  font-size: 11.5px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .end {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--text-3);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.row .hov {
  display: none;
}
.row:hover .hov {
  display: inline-flex;
}
.row:hover .unhov {
  display: none;
}
.row svg.i {
  color: var(--text-3);
}
.git {
  width: 12px;
  text-align: center;
  font: 600 11px 'Cascadia Code', Consolas, monospace;
}
.git.M,
.name.M {
  color: var(--git-m);
}
.git.A,
.git.U,
.name.A,
.name.U {
  color: var(--git-a);
}
.git.D {
  color: var(--git-d);
}
.dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--text-4);
}
.dot.run {
  background: var(--info);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--info) 22%, transparent);
}
.dot.done {
  background: var(--ok);
}
.dot.fail {
  background: var(--bad);
}
.inputbox {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  margin: 4px 0;
  padding: 0 8px;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}
.inputbox input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 12.5px;
}
.inputbox .opt {
  padding: 0 3px;
  border-radius: 3px;
  font: 11px 'Cascadia Code', Consolas, monospace;
  color: var(--text-3);
}
textarea.msg-input {
  width: 100%;
  min-height: 52px;
  margin: 2px 0 6px;
  padding: 7px 9px;
  border: 0;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  outline: 0;
  resize: vertical;
  font-size: 12.5px;
  line-height: 1.5;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
}
.btn:hover {
  background: var(--hover);
}
.btn.primary {
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: none;
}
.btn.primary:hover {
  filter: brightness(1.15);
}
.btn.sm {
  height: 24px;
  padding: 0 8px;
  font-size: 12px;
}
.btn.block {
  width: 100%;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.link {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--link);
  font-size: 12.5px;
}
.link:hover {
  text-decoration: underline;
}
.side-foot {
  display: flex;
  align-items: center;
  gap: 2px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.account {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 36px;
  padding: 0 6px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
}
.avatar {
  width: 18px;
  height: 18px;
  flex: none;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: var(--selected);
  color: var(--text-2);
  font-size: 10px;
  font-weight: 600;
}
.avatar.ai {
  background: color-mix(in srgb, var(--info) 14%, transparent);
  color: var(--info);
}
.avatar.lj {
  background: color-mix(in srgb, var(--s2) 16%, transparent);
  color: var(--s2);
}

/* Main workspace */
.main-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 8px;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  border-radius: 10px;
  background: var(--canvas);
  box-shadow: 0 0 0 1px var(--line);
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 40px;
  padding: 0 8px;
  border-bottom: 1px solid var(--line);
}
.widget {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
}
.widget:hover {
  background: var(--hover);
}
.widget .sub {
  color: var(--text-3);
  font-weight: 400;
}
.widget svg.i {
  color: var(--text-3);
}
.run-btn {
  color: var(--ok);
}
.stop-btn {
  color: var(--bad);
}
.editor-tabs {
  display: flex;
  align-items: stretch;
  flex: none;
  height: 34px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--sunken);
  border-bottom: 1px solid var(--line);
}
.etab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px 0 12px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--text-3);
  font-size: 12.5px;
  white-space: nowrap;
}
.etab:hover {
  color: var(--text);
}
.etab[aria-current] {
  background: var(--canvas);
  color: var(--text);
  box-shadow: inset 0 -1px 0 var(--canvas), inset 0 2px 0 var(--accent);
}
.etab .x {
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  opacity: 0;
}
.etab[aria-current] .x,
.etab:hover .x {
  opacity: 0.7;
}
.etab .x:hover {
  background: var(--hover);
}
.etab .mod {
  width: 7px;
  height: 7px;
  margin: 0 5px;
  border-radius: 50%;
  background: var(--text-3);
}
.etab svg.i {
  color: var(--text-3);
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
  height: 28px;
  padding: 0 8px 0 14px;
  color: var(--text-3);
  font-size: 12px;
}
.workbench {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.editor {
  flex: 1;
  min-height: 0;
  overflow: auto;
  position: relative;
}
.code {
  padding: 2px 0 60px;
  font: 12.5px/1.7 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
}
.ln {
  display: flex;
}
.ln .no {
  position: relative;
  width: 56px;
  flex: none;
  padding-right: 16px;
  text-align: right;
  color: var(--text-4);
  user-select: none;
}
.ln.cur {
  background: var(--hover);
}
.ln.cur .no {
  color: var(--text-2);
}
.ln.add .no::after,
.ln.mod .no::after {
  content: '';
  position: absolute;
  right: 5px;
  top: 2px;
  bottom: 2px;
  width: 3px;
  background: var(--git-a);
}
.ln.mod .no::after {
  background: var(--git-m);
}
.ln .tx {
  white-space: pre;
  padding-right: 24px;
}
.ln.dadd {
  background: var(--add-bg);
}
.ln.ddel {
  background: var(--del-bg);
}
.ln .wavy {
  text-decoration: underline wavy var(--warn);
  text-underline-offset: 3px;
}
.tk-kw {
  color: var(--code-kw);
}
.tk-str {
  color: var(--code-str);
}
.tk-num {
  color: var(--code-num);
}
.tk-com {
  color: var(--code-com);
  font-style: italic;
}
.inline-chat {
  margin: 4px 24px 6px 56px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font: 12.5px/1.5 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
}
.inline-chat .q {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
}
.inline-chat .a {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-top: 1px solid var(--line);
}
.codelens {
  height: 18px;
  padding-left: 56px;
  font: 11.5px 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
  color: var(--text-3);
}
.codelens button {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--text-3);
}
.codelens button:hover {
  color: var(--link);
  text-decoration: underline;
}

/* Panel and status bar */
.panel {
  flex: none;
  display: flex;
  flex-direction: column;
  height: 220px;
  border-top: 1px solid var(--line);
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 32px;
  padding: 0 6px 0 6px;
}
.ptab {
  position: relative;
  height: 32px;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
}
.ptab:hover {
  color: var(--text);
}
.ptab[aria-current] {
  color: var(--text);
  font-weight: 500;
}
.ptab[aria-current]::after {
  content: '';
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 3px;
  height: 1.5px;
  background: var(--accent);
}
.ptab .n {
  display: inline-grid;
  place-items: center;
  min-width: 16px;
  height: 16px;
  margin-left: 4px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--selected);
  font-size: 10.5px;
  font-weight: 500;
}
.panel-body {
  flex: 1;
  min-height: 0;
  display: flex;
}
.panel-list {
  width: 200px;
  flex: none;
  overflow: auto;
  padding: 2px 6px;
  border-right: 1px solid var(--line);
}
.console {
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: 2px 14px 12px;
  font: 12px/1.65 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
  white-space: pre-wrap;
}
.console .err {
  color: var(--bad);
}
.console a {
  color: var(--link);
  cursor: pointer;
  text-decoration: underline;
}
.statusbar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 24px;
  padding: 0 6px;
  border-top: 1px solid var(--line);
  background: var(--sunken);
  font-size: 11.5px;
  color: var(--text-2);
}
.sb {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  white-space: nowrap;
}
.sb:hover {
  background: var(--hover);
  color: var(--text);
}
.sb.live {
  color: var(--info);
}

/* Tables */
.grid-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.grid-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  height: 30px;
  padding: 0 10px;
  background: var(--canvas);
  border-bottom: 1px solid var(--line-strong);
  color: var(--text-3);
  font-size: 12px;
  font-weight: 500;
  text-align: left;
  white-space: nowrap;
}
.grid-table thead tr:first-child th.grp {
  height: 22px;
  border-bottom: 0;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-4);
}
.grid-table thead tr + tr th {
  top: 22px;
}
.grid-table td {
  height: 30px;
  padding: 0 10px;
  border-bottom: 1px solid var(--line);
  color: var(--text-2);
  white-space: nowrap;
}
.grid-table tr.r:hover td {
  background: var(--hover);
}
.grid-table tr.r.sel td {
  background: var(--focus-row);
}
.grid-table td:first-child,
.grid-table th:first-child {
  padding-left: 14px;
}
.grid-table .num {
  text-align: right;
}
.grid-table .best {
  color: var(--text);
  font-weight: 650;
}
.grid-table .sep {
  border-left: 1px solid var(--line);
}
.grid-table .nm {
  color: var(--text);
}
.grid-table tr.grp-row td {
  height: 28px;
  background: var(--sunken);
  font-size: 12px;
  cursor: pointer;
}
.hist {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  height: 16px;
  margin: 2px 0 4px;
}
.hist i {
  width: 6px;
  background: color-mix(in srgb, var(--s1) 55%, transparent);
}
.check {
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: var(--accent);
}
.progress {
  display: inline-block;
  width: 56px;
  height: 4px;
  border-radius: 2px;
  background: var(--selected);
  overflow: hidden;
  vertical-align: middle;
}
.progress i {
  display: block;
  height: 100%;
  background: var(--info);
}
.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ver {
  font: 12px 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.ver em {
  font-style: normal;
  color: var(--warn);
}
.subbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  height: 38px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
}
.seg {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border-radius: 7px;
  background: var(--hover);
}
.seg button {
  height: 22px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
}
.seg button[aria-pressed='true'] {
  background: var(--canvas);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.05);
}
.filter {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 240px;
  height: 26px;
  padding: 0 8px;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}
.filter input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 12px;
}
.pane-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.pane {
  min-width: 0;
  padding: 12px 16px 10px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.pane:nth-child(2n) {
  border-right: 0;
}
.pane-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  font-size: 12px;
  font-weight: 600;
}
.chart svg {
  display: block;
  width: 100%;
  overflow: visible;
}
.chart .grid line {
  stroke: var(--line);
}
.chart .axis text {
  fill: var(--text-3);
  font-size: 11px;
}
.chart .label {
  fill: var(--text-2);
  font-size: 11px;
}
.chart .hover-line {
  stroke: var(--text-4);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 4px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.legend button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 7px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
}
.legend button:hover {
  background: var(--hover);
}
.legend button.off {
  color: var(--text-4);
}
.legend i {
  width: 12px;
  height: 2px;
  border-radius: 1px;
}
.legend button.off i {
  background: var(--text-4) !important;
}
.tooltip {
  position: fixed;
  z-index: 100;
  min-width: 140px;
  padding: 7px 10px;
  border-radius: 7px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12px;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.tooltip b {
  display: block;
  margin-bottom: 3px;
  font-weight: 600;
}
.tooltip div {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tooltip div span:last-child {
  margin-left: auto;
  padding-left: 12px;
}
.tooltip i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* Documents inside editors */
.doc {
  max-width: 1000px;
  padding: 16px 24px 40px;
}
.doc-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.doc-head h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}
.doc h2 {
  margin: 20px 0 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.kv {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  gap: 5px 14px;
  margin: 0;
  font-size: 12.5px;
}
.kv dt {
  color: var(--text-3);
}
.kv dd {
  margin: 0;
}
.subnav {
  display: flex;
  gap: 2px;
  margin-top: 10px;
  border-bottom: 1px solid var(--line);
}
.subnav button {
  position: relative;
  height: 32px;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--text-3);
}
.subnav button[aria-current] {
  color: var(--text);
  font-weight: 500;
}
.subnav button[aria-current]::after {
  content: '';
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 2px;
  background: var(--accent);
}
.note-area {
  width: 100%;
  min-height: 60px;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: var(--sunken);
  box-shadow: inset 0 0 0 1px var(--line);
  outline: 0;
  resize: vertical;
  line-height: 1.6;
}
.alert {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-left: 3px solid var(--bad);
  background: color-mix(in srgb, var(--bad) 7%, transparent);
  font-size: 12.5px;
}
.welcome-head {
  padding: 64px 56px 28px;
}
.welcome-head h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.welcome {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 340px);
  gap: 56px;
  padding: 0 56px 40px;
}
.welcome h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.welcome h2 {
  margin: 26px 0 6px;
  font-size: 14px;
  font-weight: 600;
}
.welcome .lk {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--link);
  font-size: 13px;
}
.welcome .lk:hover {
  text-decoration: underline;
}
.welcome .recent {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 26px;
  font-size: 13px;
  white-space: nowrap;
}
.welcome .recent .muted {
  overflow: hidden;
  text-overflow: ellipsis;
}
.welcome .recent .muted {
  font-size: 12px;
}

/* Notebook */
.nb-bar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 34px;
  padding: 0 10px;
  border-bottom: 1px solid var(--line);
}
.cell {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  margin-right: 20px;
  padding: 6px 0;
}
.cell .gutter {
  padding: 8px 10px 0 0;
  text-align: right;
  font: 11.5px 'Cascadia Code', Consolas, monospace;
  color: var(--text-4);
}
.cell .src {
  border-radius: 6px;
  background: var(--sunken);
  box-shadow: inset 0 0 0 1px var(--line);
  padding: 8px 12px;
  font: 12.5px/1.65 'Cascadia Code', Consolas, monospace;
  white-space: pre;
  overflow-x: auto;
}
.cell.md .src {
  background: transparent;
  box-shadow: none;
  font: 13px/1.6 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
  white-space: normal;
}
.cell.md h3 {
  margin: 4px 0;
  font-size: 15px;
}
.cell.active .src {
  box-shadow: inset 0 0 0 1px var(--info);
}
.cell .out {
  grid-column: 2;
  margin-top: 6px;
  padding: 2px 12px;
  font: 12px/1.6 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.cell .out table {
  border-collapse: collapse;
  font-size: 12px;
}
.cell .out th,
.cell .out td {
  padding: 3px 14px 3px 0;
  border-bottom: 1px solid var(--line);
  text-align: right;
}
.cell .out th {
  color: var(--text-3);
  font-weight: 500;
}

/* Git graph */
.log-row {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 90px 80px 76px;
  align-items: center;
  min-height: 32px;
  padding-right: 14px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  cursor: default;
}
.log-row:hover {
  background: var(--hover);
}
.log-row.sel {
  background: var(--focus-row);
}
.log-row .rail {
  position: relative;
  align-self: stretch;
}
.log-row .rail::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--s1);
}
.log-row .rail.side::after {
  content: '';
  position: absolute;
  left: 31px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--s2);
}
.log-row .rail.first::before {
  top: 16px;
}
.log-row .rail i {
  position: absolute;
  left: 15px;
  top: 11px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--canvas);
  box-shadow: inset 0 0 0 2px var(--s1);
}
.log-row .rail i.b {
  left: 27px;
  box-shadow: inset 0 0 0 2px var(--s2);
}
.log-row .msg {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}
.log-detail {
  padding: 10px 16px 12px 58px;
  border-bottom: 1px solid var(--line);
  background: var(--sunken);
  font-size: 12.5px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  padding: 0 6px;
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  font: 11px 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.tag.run {
  box-shadow: none;
  background: var(--selected);
  font-family: inherit;
  cursor: pointer;
}
.diff2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  font: 12.5px/1.7 'Cascadia Code', Consolas, monospace;
}
.diff2 > div + div {
  border-left: 1px solid var(--line);
}

/* Overlays */
.quick {
  position: fixed;
  left: 50%;
  top: 52px;
  z-index: 60;
  width: 580px;
  transform: translateX(-50%);
  border-radius: 9px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
.quick .qin {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  margin: 6px;
  padding: 0 10px;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1.5px var(--accent);
  color: var(--text-3);
}
.quick .qin input {
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
}
.quick .ql {
  padding: 6px 14px 2px;
  font-size: 11.5px;
  color: var(--text-3);
}
.quick .qi {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 30px;
  padding: 4px 14px;
  border: 0;
  background: transparent;
  text-align: left;
}
.quick .qi:hover {
  background: var(--focus-row);
}
.quick .qi small {
  margin-left: auto;
  color: var(--text-3);
  font-size: 12px;
}
.quick .qi .mono {
  font-size: 11.5px;
  color: var(--text-3);
}
.quick .list {
  max-height: 380px;
  overflow: auto;
  padding-bottom: 6px;
}
.quick-scrim {
  position: fixed;
  inset: 0;
  z-index: 55;
}
.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: start center;
  padding-top: 10vh;
  background: rgba(12, 12, 14, 0.24);
}
.dialog {
  width: 560px;
  border-radius: 10px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.dialog-head {
  display: flex;
  align-items: center;
  padding: 14px 12px 4px 20px;
  font-size: 15px;
  font-weight: 600;
}
.dialog-body {
  padding: 10px 20px;
}
.dialog-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px 14px 20px;
  font-size: 12.5px;
}
.form-row {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 12.5px;
}
.form-row > label {
  color: var(--text-2);
}
.field {
  width: 100%;
  height: 28px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  outline: 0;
}
.field:focus {
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
.ptable {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.ptable th {
  padding: 4px 6px 4px 0;
  border-bottom: 1px solid var(--line-strong);
  color: var(--text-3);
  font-weight: 500;
  font-size: 12px;
  text-align: left;
}
.ptable td {
  padding: 4px 6px 4px 0;
  border-bottom: 1px solid var(--line);
}
.ptable td:first-child {
  width: 80px;
  font: 12px 'Cascadia Code', Consolas, monospace;
}
.ptable .field {
  height: 26px;
  font: 12px 'Cascadia Code', Consolas, monospace;
}
.menu {
  position: fixed;
  z-index: 60;
  min-width: 230px;
  padding: 4px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.menu button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  text-align: left;
  font-size: 12.5px;
}
.menu button:hover {
  background: var(--focus-row);
}
.menu button kbd {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-3);
}
.menu hr {
  height: 1px;
  margin: 4px 6px;
  border: 0;
  background: var(--line);
}
.menu .ml {
  padding: 5px 10px 2px;
  font-size: 11.5px;
  color: var(--text-3);
}
.toast {
  position: fixed;
  right: 24px;
  bottom: 60px;
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 440px;
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12.5px;
}
.toast svg.i {
  color: var(--info);
}

/* AI dock */
.dock {
  width: 340px;
  flex: none;
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  background: var(--canvas);
  box-shadow: 0 0 0 1px var(--line);
  overflow: hidden;
}
.dock-head {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 40px;
  padding: 0 6px 0 12px;
  border-bottom: 1px solid var(--line);
}
.dock-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 13px;
  line-height: 1.65;
}
.msg.me {
  align-self: flex-end;
  max-width: 90%;
  padding: 7px 11px;
  border-radius: 10px;
  background: var(--selected);
}
.ctx {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: 4px;
  background: var(--hover);
  font-size: 11.5px;
  color: var(--text-2);
}
.codeblock {
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  overflow: hidden;
  font: 12px/1.65 'Cascadia Code', Consolas, monospace;
}
.codeblock .h {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 4px 0 10px;
  border-bottom: 1px solid var(--line);
  background: var(--sunken);
  font: 12px 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
}
.codeblock .a,
.codeblock .d {
  padding: 0 10px;
  white-space: pre;
}
.codeblock .a {
  background: var(--add-bg);
  color: var(--git-a);
}
.codeblock .d {
  background: var(--del-bg);
  color: var(--git-d);
}
.composer {
  margin: 10px;
  padding: 9px 11px;
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}

/* Prototype controls and notes */
.proto {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 9px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12px;
}
.proto strong {
  padding: 0 8px;
  font-weight: 600;
}
.proto .btn {
  height: 24px;
  padding: 0 8px;
  font-size: 12px;
  box-shadow: none;
  font-weight: 400;
}
.proto .btn[aria-pressed='true'] {
  background: var(--note);
  color: #fff;
}
.note-badge {
  position: fixed;
  z-index: 85;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--note);
  color: #fff;
  font: 600 11px 'Segoe UI', sans-serif;
  box-shadow: 0 0 0 2px var(--canvas);
  pointer-events: none;
}
.note-outline {
  position: fixed;
  z-index: 69;
  border: 1.5px dashed color-mix(in srgb, var(--note) 70%, transparent);
  border-radius: 6px;
  pointer-events: none;
}
.notes {
  position: fixed;
  right: 16px;
  bottom: 56px;
  z-index: 80;
  width: 380px;
  max-height: 68vh;
  overflow: auto;
  padding: 12px 16px;
  border-radius: 10px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.notes h3 {
  margin: 0 0 6px;
  font-size: 13px;
}
.notes ol {
  margin: 0;
  padding: 0;
  list-style: none;
}
.notes li {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 10px;
  padding: 7px 0;
  border-top: 1px solid var(--line);
  font-size: 12.5px;
  line-height: 1.55;
}
.notes li b {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;

from torch import nn


class TimingModel(nn.Module):
    """决策模型：判断要不要介入、何时介入。"""

    def __init__(self, audio=True, state=True, hidden=256):
        super().__init__()
        self.use_audio = audio
        self.use_state = state
        self.video = nn.GRU(512, hidden, batch_first=True)
        self.audio = nn.GRU(128, hidden, batch_first=True) if audio else None
        self.head = nn.Linear(hidden * (1 + audio + state), 2)

    def forward(self, frames, sound=None, context=None):
        h, _ = self.video(frames)
        parts = [h[:, -1]]
        if self.use_audio:
            parts.append(self.audio(sound)[0][:, -1])
        if self.use_state:
            parts.append(context)
        return self.head(torch.cat(parts, dim=-1))`,

    if (lang === 'py')
      return safe.replace(
        /(#.*$)|("[^"\n]*"|'[^'\n]*')|\b(import|from|def|class|return|for|in|if|else|with|as|None|True|False|and|or|not|self|super)\b|\b(\d+(?:\.\d+)?(?:e-?\d+)?)\b/gm,
        (m, com, str, kw, num) => (com ? `<span class="tk-com">${com}</span>` : str ? `<span class="tk-str">${str}</span>` : kw ? `<span class="tk-kw">${kw}</span>` : `<span class="tk-num">${num}</span>`),

    if (lang === 'yaml')

    if (lang === 'md') return safe.replace(/^(#.*)$/gm, '<span class="tk-kw">$1</span>');
    return safe;
  }

  // ---------- Charts ----------
  const CHARTS = new Map();
  function niceTicks(min, max, count = 4) {
    const span = max - min || 1;
    const step0 = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0) || step0;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
    return { lo, hi, ticks };
  }
  const tickLabel = (v) => (Math.abs(v) < 10 ? (+v.toFixed(3)).toString() : Math.round(v).toString());
  function lineChart(id, input, { w = 560, h = 200, xMin = 1, xMax = 10, xLabel = 'step', labels = true } = {}) {
    const series = input.filter((s) => s.pts.length);
    const direct = labels && series.length <= 4;
    const pad = { l: 42, r: direct ? 92 : 14, t: 8, b: 24 };
    const all = series.flatMap((s) => s.pts.map((p) => p[1]));
    if (!all.length) return `<div class="muted" style="height:${h}px;display:grid;place-items:center">所选运行还没有记录这个指标</div>`;
    const { lo, hi, ticks } = niceTicks(Math.min(...all), Math.max(...all));
    const X = (x) => pad.l + ((x - xMin) / (xMax - xMin || 1)) * (w - pad.l - pad.r);
    const Y = (y) => pad.t + (1 - (y - lo) / (hi - lo || 1)) * (h - pad.t - pad.b);
    const xs = [...new Set(series.flatMap((s) => s.pts.map((p) => p[0])))].sort((a, b) => a - b);
    let out = `<svg viewBox="0 0 ${w} ${h}" role="img"><g class="grid">`;
    for (const t of ticks) out += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(t)}" y2="${Y(t)}"/>`;
    out += '</g><g class="axis">';
    for (const t of ticks) out += `<text x="${pad.l - 8}" y="${Y(t) + 4}" text-anchor="end">${tickLabel(t)}</text>`;
    for (let x = Math.ceil(xMin); x <= xMax; x += xMax - xMin > 10 ? 2 : 1) out += `<text x="${X(x)}" y="${h - 6}" text-anchor="middle">${x}</text>`;
    out += '</g>';
    for (const s of series) {
      const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ');
      out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const last = s.pts.at(-1);
      out += `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.5" fill="${s.color}" stroke="var(--canvas)" stroke-width="2"/>`;
    }
    if (direct) {
      const ls = series.map((s) => ({ s, y: Y(s.pts.at(-1)[1]) })).sort((a, b) => a.y - b.y);
      for (let i = 1; i < ls.length; i++) ls[i].y = Math.max(ls[i].y, ls[i - 1].y + 13);
      for (const l of ls) out += `<text class="label" x="${X(xMax) + 10}" y="${l.y + 4}">${esc(l.s.name)}</text>`;
    }
    out += `<line class="hover-line" x1="0" x2="0" y1="${pad.t}" y2="${h - pad.b}" visibility="hidden"/>`;
    out += `<rect x="${pad.l}" y="${pad.t}" width="${w - pad.l - pad.r}" height="${h - pad.t - pad.b}" fill="transparent" data-hover="${id}"/></svg>`;
    CHARTS.set(id, { series, X, w, xs, xLabel });
    return out;
  }

  function codeEditor(p) {

    const isTrain = p === 'train.py' && S.folder === 'timing';

    let html = '';
    lines.forEach((line, i) => {
      const n = i + 1;
      if (isTrain && n === 7) html += `<div class="codelens"><button data-act="run-now">运行</button> | <button data-act="toast" data-text="调试（第 4 期）">调试</button> | <button data-act="open-tab" data-k="runs">8 次运行 · 最好 f1 0.702</button></div>`;

      let tx = highlight(line, file.lang) || ' ';
      if (file.warn === n) tx = tx.replace('pandas', '<span class="wavy" title="ruff F401: pandas 已导入但未使用">pandas</span>');
      html += `<div class="ln ${cls}"><span class="no">${n}</span><span class="tx">${tx}</span></div>`;
      if (isTrain && S.inline && n === 21) {
        html += `<div class="inline-chat"><div class="q">${icon('sparkles', 14)}<span style="flex:1">每 100 步记录一次 loss，并加上验证集 loss</span><span class="muted" style="font-size:12px">train.py · 第 19–24 行</span></div></div>`;

          ['dadd', '            if step % 100 == 0:'],

      ${sel ? `<span class="muted" style="font-size:12px">已选 ${sel}</span><button class="btn sm" data-act="compare" ${sel < 2 ? 'disabled' : ''}>${icon('columns', 12)}比较</button>` : ''}
      <button class="ib sm" title="导出 CSV" data-act="toast" data-text="已导出 runs.csv">${icon('download', 14)}</button>
    </div>`;
    if (S.runsMode === 'charts') return sub + runsCharts(rs);
    const row = (r, indent) => {
      const live = r.status === 'running';
      return `<tr class="r ${S.selected.includes(r.id) ? 'sel' : ''}" data-act="open-run" data-id="${r.id}">
        <td style="width:34px"><input type="checkbox" class="check" data-act="select" data-id="${r.id}" ${S.selected.includes(r.id) ? 'checked' : ''}></td>
        <td style="padding-left:${indent ? 26 : 10}px"><span class="state"><span class="dot ${statusDot(r)}"></span><span class="nm">${esc(r.name)}</span>${r.star ? '<span style="color:var(--s4)">★</span>' : ''}</span></td>
        <td>${live ? `<span class="progress"><i style="width:${r.epoch * 10}%"></i></span> <span class="muted">${Math.floor(r.epoch)}/10</span>` : statusText(r)}</td>
        ${PARAMS.map((p, i) => `<td class="mono ${i === 0 ? 'sep' : ''}" style="font-size:12px">${r.params[p] ?? '—'}</td>`).join('')}
        ${METRICS.map((m, i) => {
          const v = live && m.key === 'f1' ? latestF1(r) : r.m?.[m.key];
          return `<td class="num mono ${i === 0 ? 'sep' : ''} ${bestBy[m.key] === r.id ? 'best' : ''}" style="font-size:12px">${v == null ? '<span class="muted">—</span>' : fmt(m.key, v)}</td>`;
        }).join('')}
        <td class="sep"><span class="ver">${r.ver}${r.dirty ? '<em>*</em>' : ''}</span></td>
        <td>${person(r.by)}</td><td class="muted mono" style="font-size:12px">${r.when}</td><td class="muted num mono" style="font-size:12px">${r.dur}</td>
      </tr>`;
    };
    let body = '';
    if (S.runsGroup === 'commit') {
      const byVer = {};
      for (const r of filtered) (byVer[r.ver] ||= []).push(r);
      for (const [ver, list] of Object.entries(byVer)) {
        const c = S.commits.find((x) => x.id === ver);
        body += `<tr class="grp-row"><td colspan="${3 + PARAMS.length + METRICS.length + 4}">${icon('git', 13)} <span class="ver">${ver}</span> ${esc(c?.msg || '')} <span class="muted">· ${list.length} 次</span></td></tr>`;
        body += list.map((r) => row(r, true)).join('');
      }
    } else {
      const seen = new Set();
      for (const r of filtered) {
        if (S.runsGroup === 'group' && r.group) {
          if (seen.has(r.group)) continue;
          seen.add(r.group);
          const g = S.groups[r.group];
          const members = filtered.filter((x) => x.group === r.group);
          const b = best(members, 'f1');
          body += `<tr class="grp-row" data-act="toggle-group" data-id="${r.group}"><td colspan="${3 + PARAMS.length + METRICS.length + 4}">${icon(S.groupsOpen[r.group] ? 'down' : 'right', 12)} ${esc(g.name)} <span class="muted">· ${members.length} 次${b ? ` · 最好 f1 ${b.m.f1.toFixed(3)}` : ''}</span> ${person(g.by)}</td></tr>`;
          if (S.groupsOpen[r.group]) body += members.map((m) => row(m, true)).join('');
        } else body += row(r, false);
      }
    }
    return `${sub}<div class="editor" data-scroll="runs" data-note="5"><table class="grid-table">
      <thead><tr><th class="grp" colspan="3"></th><th class="grp sep" colspan="${PARAMS.length}">参数</th><th class="grp sep" colspan="${METRICS.length}">指标（最后一步）</th><th class="grp sep" colspan="4"></th></tr>
      <tr><th></th><th>名称</th><th>状态</th>${PARAMS.map((p, i) => `<th class="mono ${i === 0 ? 'sep' : ''}" style="font-weight:400">${p}</th>`).join('')}${METRICS.map((m, i) => `<th class="num mono ${i === 0 ? 'sep' : ''}" style="font-weight:400">${m.label} ${m.dir === 'up' ? '↑' : '↓'}</th>`).join('')}<th class="sep">提交</th><th>发起</th><th>开始</th><th class="num">用时</th></tr></thead>
      <tbody>${body || `<tr><td colspan="16" class="muted" style="text-align:center;height:80px">还没有运行。点工具栏的 ${icon('play', 12)} 运行，或在运行视图里选一个配置。</td></tr>`}</tbody></table></div>`;
  }

  function runsCharts(rs) {
    const shown = S.visible.map(runById).filter((r) => r && r.folder === S.folder);
    shown.forEach((r) => ensureSlot(r.id));
    const legend = `<div class="legend"><span class="muted" style="margin-right:4px">显示</span>${rs
      .filter((r) => r.curves.f1.length)
      .map((r) => `<button class="${S.visible.includes(r.id) ? '' : 'off'}" data-act="toggle-visible" data-id="${r.id}"><i style="background:${color(r.id)}"></i>${esc(short(r))}</button>`)
      .join('')}</div>`;
    const series = (k) => shown.map((r) => ({ name: short(r), color: color(r.id), pts: r.curves[k] }));
    const table = `<table class="grid-table"><thead><tr><th>运行</th>${METRICS.map((m) => `<th class="num mono" style="font-weight:400">${m.label}</th>`).join('')}<th class="num">最好 f1 出现在</th></tr></thead><tbody>${shown.map((r) => `<tr class="r"><td><span class="state"><i style="width:10px;height:2px;background:${color(r.id)}"></i>${esc(short(r))}</span></td>${METRICS.map((m) => `<td class="num mono" style="font-size:12px">${fmt(m.key, m.key === 'f1' ? latestF1(r) : r.m?.[m.key])}</td>`).join('')}<td class="num mono" style="font-size:12px">${r.curves.f1.length ? 'step ' + r.curves.f1.reduce((a, b) => (b[1] > a[1] ? b : a))[0] : '—'}</td></tr>`).join('')}</tbody></table>`;
    return `${legend}<div class="editor" data-scroll="charts" data-note="5"><div class="pane-grid">
      <div class="pane"><div class="pane-head">f1<span class="spacer"></span><button class="ib sm" title="更多" data-act="menu" data-kind="chart">${icon('more', 13)}</button></div><div class="chart">${lineChart('ch-f1', series('f1'), { w: 520, h: 200 })}</div></div>
      <div class="pane"><div class="pane-head">loss<span class="spacer"></span><button class="ib sm" title="更多" data-act="menu" data-kind="chart">${icon('more', 13)}</button></div><div class="chart">${lineChart('ch-loss', series('loss'), { w: 520, h: 200 })}</div></div>
      <div class="pane" style="grid-column:1/-1;border-right:0;padding:0"><div class="pane-head" style="padding:12px 16px 4px">汇总</div>${table}</div>
    </div></div>`;
  }

  function compareView() {
    const rs = S.selected.map(runById).filter(Boolean);
    rs.forEach((r) => ensureSlot(r.id));
    const series = rs.map((r) => ({ name: short(r), color: color(r.id), pts: r.curves.f1 }));
    const paramRows = PARAMS.map((p) => {
      const vals = rs.map((r) => r.params[p] ?? '—');
      const diff = new Set(vals.map(String)).size > 1;
      return `<tr class="r"><td class="mono">${p}</td>${vals.map((v) => `<td class="mono" style="${diff ? 'font-weight:650;color:var(--text);background:color-mix(in srgb, var(--s4) 10%, transparent)' : ''}">${v}</td>`).join('')}</tr>`;
    }).join('');
    const metricRows = METRICS.map((m) => {
      const vals = rs.map((r) => r.m?.[m.key] ?? null);
      const valid = vals.filter((v) => v != null);
      const b = valid.length > 1 ? (m.dir === 'up' ? Math.max(...valid) : Math.min(...valid)) : null;
      return `<tr class="r"><td class="mono">${m.label}</td>${vals.map((v) => `<td class="mono ${v === b ? 'best' : ''}">${fmt(m.key, v)}</td>`).join('')}</tr>`;
    }).join('');
    const vers = [...new Set(rs.map((r) => r.ver))];
    return `<div class="subbar"><button class="ib sm" data-act="compare-off" title="返回">${icon('back', 14)}</button><b style="font-weight:600">比较 ${rs.length} 次运行</b><span class="spacer"></span><button class="btn sm" data-act="ai" data-topic="summary">${icon('sparkles', 12)}让 AI 总结</button><button class="btn sm" data-act="toast" data-text="已插入到当前笔记：图表、参数差异和指标表">${icon('note', 12)}插入到笔记</button></div>
      <div class="editor" data-scroll="cmp" data-note="5">
        <div class="pane" style="border-right:0"><div class="pane-head">f1</div><div class="chart">${lineChart('cmp', series, { w: 1060, h: 220 })}</div></div>
        <div class="pane-grid">
          <div class="pane" style="padding:0"><div class="pane-head" style="padding:12px 14px 4px">参数 <span class="muted" style="font-weight:400">高亮的是不同的值</span></div><table class="grid-table"><thead><tr><th></th>${rs.map((r) => `<th><span class="state"><i style="width:10px;height:2px;background:${color(r.id)}"></i>${esc(short(r))}</span></th>`).join('')}</tr></thead><tbody>${paramRows}</tbody></table></div>
          <div class="pane" style="padding:0"><div class="pane-head" style="padding:12px 14px 4px">指标</div><table class="grid-table"><thead><tr><th></th>${rs.map((r) => `<th>${esc(short(r))}</th>`).join('')}</tr></thead><tbody>${metricRows}</tbody></table>
            <div style="padding:10px 14px;font-size:12.5px;display:flex;align-items:center;gap:8px">${icon('git', 14)}${vers.length > 1 ? `代码来自不同提交：${vers.map((v) => `<span class="ver">${v}</span>`).join(' / ')} <button class="link" data-act="open-diff" data-path="src/model.py">查看差异</button>` : `<span class="muted">代码来自同一提交 ${vers[0]}</span>`}</div></div>
        </div>
      </div>`;
  }

  function runEditor(r) {
    if (!r) return '<div class="editor"></div>';
    ensureSlot(r.id);
    const t = S.runTab[r.id] || 'overview';
    const commit = S.commits.find((c) => c.id === r.ver);
    const cmd = `python ${r.config === 'eval' ? 'eval.py' : 'train.py'} ${Object.entries(r.params).map(([k, v]) => `--${k} ${v}`).join(' ')}`;
    let body = '';
    if (t === 'overview') {
      body = `${r.status === 'failed' ? `<div class="alert" style="margin-top:14px">${icon('error', 15)}<span class="mono" style="font-size:12px">${esc(r.error)}</span><span class="spacer"></span><button class="btn sm" data-act="ai" data-topic="debug">${icon('sparkles', 12)}让 AI 排查</button></div>` : ''}
        <h2>运行</h2><dl class="kv">
          <dt>配置</dt><dd>${r.config === 'eval' ? '评测' : '训练'} · <span class="mono">${r.config === 'eval' ? 'eval.py' : 'train.py'}</span></dd>
          <dt>命令</dt><dd class="mono" style="font-size:12px">${esc(cmd)}</dd>
          <dt>提交</dt><dd><button class="link mono" data-act="open-commit" data-id="${r.ver}">${r.ver}</button> ${esc(commit?.msg || '')}${r.dirty ? ` <span style="color:var(--warn)">+ 当时未提交的更改 2 个文件</span> <button class="link" data-act="open-diff" data-path="src/model.py">查看</button>` : ''}</dd>
          <dt>解释器</dt><dd>Python ${envText()} · 依赖 38 个（已记录）</dd>
          <dt>数据</dt><dd class="mono" style="font-size:12px">data/events.csv · sha256 3f2a9c…</dd>
          <dt>开始</dt><dd>${r.when} · 用时 ${r.dur} · ${person(r.by)} ${personName(r.by)}${r.by === 'ai' ? '（AI 对话“学习率怎么选”）' : ''}</dd>
        </dl>
        <h2>参数</h2><table class="grid-table" style="max-width:420px"><tbody>${Object.entries(r.params).map(([k, v]) => `<tr><td class="mono" style="width:120px">${k}</td><td class="mono">${v}</td></tr>`).join('')}</tbody></table>
        <h2>指标（最后一步）</h2><table class="grid-table" style="max-width:420px"><tbody>${METRICS.map((m) => `<tr><td class="mono" style="width:120px">${m.label}</td><td class="mono">${fmt(m.key, m.key === 'f1' ? latestF1(r) : r.m?.[m.key])}</td></tr>`).join('')}</tbody></table>
        <h2>备注</h2><textarea class="note-area" data-input="notes" data-id="${r.id}" placeholder="这次运行说明了什么">${esc(r.notes)}</textarea>`;
    } else if (t === 'log') {
      body = `<div class="console" style="padding:12px 0;max-height:none">${runLog(r)}</div>`;
    } else if (t === 'metrics') {
      body = r.curves.f1.length
        ? `<div class="pane-grid" style="margin-top:12px;border-top:1px solid var(--line)"><div class="pane"><div class="pane-head">f1</div><div class="chart">${lineChart('r-f1', [{ name: short(r), color: color(r.id), pts: r.curves.f1 }], { w: 460, h: 180, labels: false })}</div></div><div class="pane"><div class="pane-head">loss</div><div class="chart">${lineChart('r-loss', [{ name: short(r), color: color(r.id), pts: r.curves.loss }], { w: 460, h: 180, labels: false })}</div></div></div>`
        : `<div class="muted" style="padding:30px 0">这次运行没有写入 metrics.jsonl</div>`;
    } else {
      body = r.status === 'failed'
        ? `<div class="muted" style="padding:30px 0">没有产物</div>`
        : `<table class="grid-table" style="margin-top:12px"><thead><tr><th>文件</th><th class="num">大小</th></tr></thead><tbody>${[
            ['metrics.jsonl', r.status === 'running' ? '写入中' : '12 KB', ''],
            ['summary.json', '1 KB', ''],
            ['checkpoints/best.pt', '48.2 MB', ''],
            ['figures/pr_curve.png', '86 KB', 'outputs/figures/pr_curve.png'],
          ].map(([n, s, open]) => `<tr class="r" ${open ? `data-act="open-file" data-path="${open}"` : ''}><td class="mono" style="font-size:12px">${icon(n.endsWith('.png') ? 'image' : 'file', 13)} ${n}</td><td class="num muted">${s}</td></tr>`).join('')}</tbody></table>`;
    }
    return `<div class="editor" data-scroll="run-${r.id}" data-note="5"><div class="doc">
      <div class="doc-head"><span class="dot ${statusDot(r)}"></span><h1>${esc(r.name)}</h1><span class="muted">${statusText(r)}</span><span class="spacer"></span>
        ${r.status === 'running' ? `<button class="btn sm" data-act="stop" data-id="${r.id}">${icon('stop', 12)}停止</button>` : `<button class="btn sm" data-act="rerun" data-id="${r.id}">${icon('rerun', 12)}重新运行</button><button class="btn sm" data-act="rerun-orig" data-id="${r.id}" title="检出当时的提交和未提交的更改，在临时工作树里运行">${icon('history', 12)}用原代码运行</button>`}
        <button class="btn sm" data-act="toast" data-text="已插入到当前笔记：参数、指标和曲线（随运行记录更新）">${icon('note', 12)}插入到笔记</button>
        <button class="ib sm" data-act="star" data-id="${r.id}" title="收藏" style="color:${r.star ? 'var(--s4)' : ''}">★</button></div>
      <div class="subnav">${[['overview', '概览'], ['log', '日志'], ['metrics', '指标'], ['files', '产物']].map(([id, l]) => `<button data-act="run-tab" data-id="${id}" data-run="${r.id}" ${t === id ? 'aria-current="true"' : ''}>${l}</button>`).join('')}</div>
      ${body}</div></div>`;
  }

  function graphEditor() {
    const rows = S.commits
      .map((c, i) => {
        const runs = S.runs.filter((r) => r.ver === c.id);
        const open = S.openCommit === c.id;
        return `<div class="log-row ${open ? 'sel' : ''}" data-act="toggle-commit" data-id="${c.id}">
          <div class="rail ${i === 0 ? 'first' : ''} ${i >= 1 && i <= 2 ? 'side' : ''}"><i class="${c.side ? 'b' : ''}"></i></div>
          <div class="msg">${c.refs.map((b) => `<span class="tag">${icon('branch', 11)}${b}</span>`).join('')}<span>${esc(c.msg)}</span>${runs.map((r) => `<span class="tag run" data-act="open-run" data-id="${r.id}"><span class="dot ${statusDot(r)}"></span>${esc(short(r))}${r.m?.f1 != null ? ' · f1 ' + r.m.f1.toFixed(3) : ''}</span>`).join('')}</div>
          <div>${person(c.by)} <span class="muted">${personName(c.by)}</span></div><div class="muted mono" style="font-size:12px">${c.when}</div><div class="ver">${c.id}</div></div>
          ${open ? `<div class="log-detail">${c.files.map((f) => `<div><button class="link mono" style="font-size:12px" data-act="open-diff" data-path="${f}">${f}</button></div>`).join('')}
            <div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm" data-act="toast" data-text="已检出 ${c.id}（分离头指针）">检出</button><button class="btn sm" data-act="toast" data-text="从 ${c.id} 创建分支">${icon('branch', 12)}从此处创建分支</button><button class="btn sm" data-act="toast" data-text="在新文件夹中检出 ${c.id}（工作树），作为新的文件夹加入实验">在新文件夹中检出</button><button class="btn sm" data-act="run-commit" data-id="${c.id}">${icon('play', 11)}用此提交运行</button></div></div>` : ''}`;
      })
      .join('');
    return `<div class="subbar"><button class="widget" style="height:24px;font-size:12px">${icon('branch', 13)}全部分支${icon('down', 12)}</button><div class="filter">${icon('search', 13)}<input placeholder="搜索提交"></div><span class="spacer"></span><button class="btn sm" data-act="toast" data-text="推送和拉取在后续版本加入；现在代码通过项目同步共享给团队">${icon('sync', 12)}同步更改 ${folder().ahead}${icon('up', 11)}</button></div>
      <div class="editor" data-scroll="graph" data-note="5">${rows}</div>`;
  }

  function diffEditor(p) {
    const lines = DIFFS[p] || DIFFS['src/model.py'];
    const side = (which) =>
      lines
        .map(([k, a, b], i) => {
          const t = which === 'l' ? a : b;
          const cls = which === 'l' ? (k === 'm' ? 'ddel' : k === 'a' ? '' : '') : k === 'a' || k === 'm' ? 'dadd' : '';
          const blank = which === 'l' && k === 'a';
          return `<div class="ln ${cls}" style="${blank ? 'background:repeating-linear-gradient(45deg,transparent 0 4px,var(--hover) 4px 8px)' : ''}"><span class="no">${blank ? '' : i + 8}</span><span class="tx">${highlight(t, p.endsWith('.yaml') ? 'yaml' : 'py') || ' '}</span></div>`;
        })
        .join('');
    return `${crumb(p, `<span class="muted" style="font-size:12px">HEAD ↔ 工作树</span>`)}<div class="editor" data-note="5"><div class="diff2"><div class="code">${side('l')}</div><div class="code">${side('r')}</div></div></div>`;
  }

  // ---------- Panel ----------
  function runLog(r) {
    if (!r) return '';
    const lines = [`<span class="muted">$ python train.py ${Object.entries(r.params).map(([k, v]) => `--${k} ${v}`).join(' ')}</span>`, `<span class="muted">[Capsio] 运行 ${esc(r.name)} · 提交 ${r.ver}${r.dirty ? ' + 未提交的更改（已保存快照）' : ''} · Python ${envText()}</span>`];
    for (const [e, f] of r.curves.f1) lines.push(`epoch ${String(e).padStart(2)} | loss ${(r.curves.loss.find((p) => p[0] === e)?.[1] ?? 0).toFixed(3)} | f1 ${f.toFixed(3)}`);
    if (r.status === 'running') lines.push(`<span class="muted">…</span>`);
    if (r.status === 'failed') lines.push(`<span class="err">Traceback (most recent call last):\n  File "<a data-act="open-file" data-path="train.py">train.py</a>", line 20, in main\n    loss = model.train_epoch(data.train, lr=args.lr)\n${esc(r.error)}. Tried to allocate 2.00 GiB</span>`);
    if (r.status === 'done') lines.push(`<span class="muted">[Capsio] 进程以退出码 0 结束 · 用时 ${r.dur} · 记录了 3 个指标</span>`);
    return lines.join('\n');
  }
  function panel() {
    if (!S.panel.open) return '';
    const rs = runsOf();
    const shownRuns = rs.filter((r) => ['running', 'queued'].includes(r.status)).concat(rs.filter((r) => !['running', 'queued'].includes(r.status)).slice(0, 3));
    const cur = runById(S.panel.run) && runById(S.panel.run).folder === S.folder ? runById(S.panel.run) : shownRuns[0];
    const problems = S.folder === 'timing' ? 2 : 0;
    let body = '';
    if (S.panel.tab === 'run') {
      body = `<div class="panel-list">${shownRuns.map((r) => `<button class="row" data-act="panel-run" data-id="${r.id}" ${cur?.id === r.id ? 'aria-current="true"' : ''}><span class="dot ${statusDot(r)}" style="margin:0 3px"></span><span class="name">${esc(r.name)}</span></button>`).join('') || '<div class="muted" style="padding:6px;font-size:12px">还没有运行</div>'}</div>
        <div class="console" data-scroll="console">${cur ? runLog(cur) : ''}</div>
        ${cur ? `<div style="display:flex;flex-direction:column;gap:2px;padding:4px">${cur.status === 'running' ? `<button class="ib sm stop-btn" title="停止" data-act="stop" data-id="${cur.id}">${icon('stop', 13)}</button>` : `<button class="ib sm" title="重新运行" data-act="rerun" data-id="${cur.id}">${icon('rerun', 13)}</button>`}<button class="ib sm" title="打开运行记录" data-act="open-run" data-id="${cur.id}">${icon('open', 13)}</button></div>` : ''}`;
    } else if (S.panel.tab === 'terminal') {
      body = `<div class="console">${`<span class="muted">(.venv) PS ${esc(folder().path)}&gt;</span> python -c "import torch; print(torch.cuda.is_available())"\nTrue\n<span class="muted">(.venv) PS ${esc(folder().path)}&gt;</span> ▍`}</div>`;
    } else if (S.panel.tab === 'problems') {

  function placeBadges() {

      seen.add(n);
      const o = document.createElement('div');
      o.className = 'note-outline';
      Object.assign(o.style, { left: r.left - 2 + 'px', top: r.top - 2 + 'px', width: r.width + 4 + 'px', height: Math.min(r.height, window.innerHeight - r.top - 4) + 4 + 'px' });
      const b = document.createElement('div');
      b.className = 'note-badge';
      b.textContent = n;
      Object.assign(b.style, { left: r.left - 9 + 'px', top: r.top - 9 + 'px' });
      document.body.append(o, b);
    }
  }

  // ---------- Render ----------
  function render() {
    const scrolls = {};
    document.querySelectorAll('[data-scroll]').forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
    const focus = document.activeElement?.dataset?.input ? document.activeElement.dataset.input + (document.activeElement.dataset.p || '') : null;
    const sel = focus && 'selectionStart' in document.activeElement ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
    CHARTS.clear();
    document.getElementById('root').innerHTML = `<div class="app" data-theme="${S.theme}">
      ${titlebar()}
      <div class="body">${sidebar()}<div class="main-wrap"><main class="main">${toolbar()}${editorTabs()}<div class="workbench">${editorBody()}</div>${panel()}${statusbar()}</main>${dock()}</div></div>
      ${quick()}${dialog()}${menu()}
      ${S.toast ? `<div class="toast">${icon('check', 14)}${esc(S.toast.text)}</div>` : ''}
      ${notesPanel()}
      <div class="proto"><strong>实验 · 原型</strong><button class="btn" data-act="annotate" aria-pressed="${S.annotate}">标注</button><button class="btn" data-act="theme">${S.theme === 'graphite' ? '夜' : '石墨'}</button><button class="btn" data-act="reset">重置</button></div>
    </div>`;
    document.body.dataset.theme = S.theme;
    document.querySelectorAll('[data-scroll]').forEach((el) => {
      if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll];
    });
    if (focus) {
      const el = [...document.querySelectorAll('[data-input]')].find((n) => n.dataset.input + (n.dataset.p || '') === focus);
      if (el) {
        el.focus();
        if (sel && el.setSelectionRange) el.setSelectionRange(...sel);
      }
    }
    if (S.inlineFresh) {
      S.inlineFresh = false;
      document.querySelector('.inline-chat')?.scrollIntoView({ block: 'start' });
    }
    placeBadges();
  }

  // ---------- Actions ----------
  function startRun(params, name, group = null, extra = {}) {
    const id = 'n' + S.nextRun++;
    const r = mkRun({ id, folder: S.folder, name, status: 'running', epoch: 0, params, m: null, target: 0.66 + ((S.nextRun * 37) % 50) / 1000, ver: S.commits[0].id, dirty: S.changes.length > 0, by: 'me', when: '11-15 ' + new Date().toTimeString().slice(0, 5), dur: '0m', seedv: S.nextRun, group, config: S.config, ...extra });
    S.runs.unshift(r);
    return r;
  }
  function act(el, ev) {
    const a = el.dataset.act;
    const id = el.dataset.id;
    const close = () => {
      S.menu = null;
      S.quick = null;
    };
    switch (a) {
      case 'view':
        S.view = id;
        break;
      case 'toggle-dir': {
        const p = el.dataset.path;
        S.collapsed = S.collapsed.includes(p) ? S.collapsed.filter((x) => x !== p) : [...S.collapsed, p];
        break;
      }
      case 'collapse-all':
        S.collapsed = (TREES[S.folder] || []).filter((x) => x[1] === 'dir').map((x) => x[0]);
        break;
      case 'open-file':
        ev.stopPropagation();
        close();
        openTab('f:' + el.dataset.path);
        break;
      case 'open-tab':
        close();
        openTab(el.dataset.k);
        break;
      case 'open-diff':
        ev.stopPropagation();
        openTab('diff:' + el.dataset.path);
        break;
      case 'open-run':
        if (ev.target.closest('[data-act="select"]')) return;
        ev.stopPropagation();
        close();
        openTab('run:' + id);
        break;
      case 'open-commit':
        close();
        S.openCommit = id;
        openTab('graph');
        break;
      case 'toggle-commit':
        if (ev.target.closest('[data-act="open-run"]')) return;
        S.openCommit = S.openCommit === id ? null : id;
        break;
      case 'tab':
        tabsOf().active = el.dataset.k;
        break;
      case 'close-tab': {
        ev.stopPropagation();
        const t = tabsOf();
        const i = t.list.indexOf(el.dataset.k);
        t.list.splice(i, 1);
        if (t.active === el.dataset.k) t.active = t.list[Math.max(0, i - 1)] || null;
        break;
      }
      case 'run-tab':
        S.runTab[el.dataset.run] = id;
        break;
      case 'ptab':
        close();
        S.panel.open = true;
        S.panel.tab = id;
        break;
      case 'panel-toggle':
        S.panel.open = !S.panel.open;
        break;
      case 'panel-run':
        S.panel.run = id;
        break;
      case 'runs-mode':
        S.runsMode = id;
        break;
      case 'runs-group':
        S.runsGroup = id;
        S.menu = null;
        break;
      case 'toggle-group':
        S.groupsOpen[id] = !S.groupsOpen[id];
        break;
      case 'select': {
        ev.stopPropagation();
        S.selected = el.checked ? [...S.selected, id].slice(-6) : S.selected.filter((x) => x !== id);
        break;
      }
      case 'compare':
        S.compare = true;
        break;
      case 'compare-off':
        S.compare = false;
        break;
      case 'toggle-visible':
        if (S.visible.includes(id)) {
          S.visible = S.visible.filter((x) => x !== id);
          delete S.slots[id];
        } else if (S.visible.length >= 6) toast('最多同时显示 6 次运行');
        else {
          S.visible.push(id);
          ensureSlot(id);
        }
        break;
      case 'star': {
        const r = runById(id);
        r.star = !r.star;
        break;
      }
      case 'set-config':
        if (ev.target.closest('[data-act="run-now"]')) return;
        S.config = id;
        S.menu = null;
        break;
      case 'run-now': {
        ev.stopPropagation();
        close();
        if (id) S.config = id;
        const r = startRun({ window: 8, audio: 'on', state: 'on', lr: '3e-4', seed: 0 }, `timing-abl-${String(S.nextRun).padStart(2, '0')}`);
        S.panel = { open: true, tab: 'run', run: r.id };
        toast(`已开始 ${r.name}，输出在面板“运行”里`);
        break;
      }
      case 'run-commit': {
        const r = startRun({ window: 8, audio: 'on', state: 'on', lr: '3e-4', seed: 0 }, `at-${id}`, null, { ver: id, dirty: false });
        S.panel = { open: true, tab: 'run', run: r.id };
        toast(`已在临时工作树里用 ${id} 开始运行`);
        break;
      }
      case 'rerun':
      case 'rerun-orig': {
        const src = runById(id);
        const r = startRun({ ...src.params }, `${src.name}-re`, null, a === 'rerun-orig' ? { ver: src.ver, dirty: false } : {});
        S.panel = { open: true, tab: 'run', run: r.id };
        toast(a === 'rerun-orig' ? `已检出 ${src.ver}${src.dirty ? ' 和当时的更改' : ''}，开始 ${r.name}` : `已用当前代码重新运行 ${src.name}`);
        break;
      }
      case 'stop': {
        const r = runById(id);
        r.status = 'stopped';
        toast(`已停止 ${r.name}`);
        break;
      }
      case 'stop-all':
        runsOf().filter((r) => r.status === 'running').forEach((r) => (r.status = 'stopped'));
        toast('已停止正在运行的程序');
        break;
      case 'stage':
        ev.stopPropagation();
        S.staged.push(el.dataset.path);
        break;
      case 'stage-all':
        S.staged = S.changes.map((c) => c.path);
        break;
      case 'unstage':
        ev.stopPropagation();
        S.staged = S.staged.filter((p) => p !== el.dataset.path);
        break;
      case 'discard':
        ev.stopPropagation();
        S.dialog = { kind: 'confirm', title: '放弃更改', text: `确定要放弃 ${el.dataset.path} 中的更改吗？此操作不可撤消。`, ok: '放弃文件', then: 'discard', path: el.dataset.path };
        break;
      case 'ai-msg':
        S.commitMsg = '跳过音频编码器时不再构建 GRU；观察窗口改为参数；新增消融配置';
        break;
      case 'commit': {
        const files = S.staged.length ? S.staged : S.changes.map((c) => c.path);
        if (!S.commitMsg.trim()) {
          toast('请输入提交消息（可以点 ✦ 让 AI 生成）');
          break;
        }
        const hash = ['e41b9d2', 'f02c7a8', '9ab3e61'][S.commits.length % 3];
        S.commits.unshift({ id: hash, msg: S.commitMsg.trim(), by: 'me', when: '11-15 ' + new Date().toTimeString().slice(0, 5), refs: ['main'], files });
        S.commits[1].refs = S.commits[1].refs.filter((r) => r !== 'main');
        S.changes = S.changes.filter((c) => !files.includes(c.path));
        S.staged = [];
        S.commitMsg = '';
        folder().ahead += 1;
        toast(`已提交 ${hash}（${files.length} 个文件）`);
        break;
      }
      case 'branch':
        close();
        if (id === 'ablation/audio-free') {
          S.folder = 'audio';
          toast('这个分支已在 timing-audio-free 文件夹中检出，已切换过去');
        } else if (id !== folder().branch) {
          folder().branch = id;
          toast(`已检出 ${id}`);
        }
        break;
      case 'folder':
        close();
        S.folder = id;
        S.compare = false;
        S.selected = [];
        if (!S.tabs[id]) S.tabs[id] = { list: ['welcome'], active: 'welcome' };
        S.visible = runsOf().filter((r) => r.curves.f1.length).slice(0, 4).map((r) => r.id);
        S.slots = {};
        S.visible.forEach(ensureSlot);
        break;
      case 'new-folder': {
        close();
        const n = S.folders.length;
        const nid = 'new' + n;
        S.folders.push({ id: nid, name: 'untitled-' + n, path: 'D:\\AScience\\Proactive\\untitled-' + n, env: 'venv', branch: 'main', ahead: 0 });
        TREES[nid] = [];
        S.tabs[nid] = { list: ['welcome'], active: 'welcome' };
        S.folder = nid;
        toast('已新建空文件夹并初始化 Git 仓库');
        break;
      }
      case 'clone-ok': {
        close();
        S.folder = 'repro';
        toast('已克隆 ProAgent；检测到 environment.yml，已用 conda 创建环境 proagent');
        break;
      }
      case 'set-env':
        close();
        folder().env = id;
        toast(`“${folder().name}”改用 Python ${ENVS[id].label} (${ENVS[id].kind})`);
        break;
      case 'quick':
        ev.stopPropagation();
        S.menu = null;
        S.quick = { kind: el.dataset.kind };
        break;
      case 'quick-close':
        S.quick = null;
        break;
      case 'menu': {
        ev.stopPropagation();
        const r = el.getBoundingClientRect();
        S.menu = { kind: el.dataset.kind, x: Math.min(r.left, window.innerWidth - 250), y: r.bottom + 4 };
        break;
      }
      case 'dialog':
        close();
        S.dialog = { kind: 'params', name: 'seed 扫描', values: { window: '8', audio: 'on', state: 'off', lr: '3e-4', seed: '0, 1, 2' }, multi: { seed: true } };
        break;
      case 'dialog-close':
        S.dialog = null;
        break;
      case 'scrim':
        if (ev.target !== el) return;
        S.dialog = null;
        break;
      case 'confirm-ok': {
        const d = S.dialog;
        S.dialog = null;
        if (d.then === 'discard') {
          S.changes = S.changes.filter((c) => c.path !== d.path);
          S.staged = S.staged.filter((p) => p !== d.path);
          toast(`已放弃 ${d.path} 的更改`);
        }
        break;
      }
      case 'd-multi':
        S.dialog.multi[el.dataset.p] = el.checked;
        if (el.checked && !S.dialog.values[el.dataset.p].includes(',')) S.dialog.values[el.dataset.p] = { lr: '1e-4, 3e-4', seed: '0, 1, 2', audio: 'on, off', state: 'on, off', window: '4, 8' }[el.dataset.p];
        break;
      case 'start-runs': {
        const d = S.dialog;
        const lists = PARAMS.map((p) => (d.multi[p] ? d.values[p].split(',').map((s) => s.trim()).filter(Boolean) : [d.values[p].trim()]));
        const combos = lists.reduce((acc, list, i) => acc.flatMap((c) => list.map((v) => ({ ...c, [PARAMS[i]]: v }))), [{}]);
        let group = null;
        if (combos.length > 1) {
          group = 'g' + (Object.keys(S.groups).length + 1);
          S.groups[group] = { name: d.name || '参数组', by: 'me' };
          S.groupsOpen[group] = true;
        }
        [...combos].reverse().forEach((c, ri) => {
          const i = combos.length - 1 - ri;
          const label = combos.length > 1 ? PARAMS.filter((p) => d.multi[p]).map((p) => `${p}=${c[p]}`).join(' ') : d.name;
          const r = startRun(Object.fromEntries(Object.entries(c).map(([k, v]) => [k, k === 'window' || k === 'seed' ? Number(v) : v])), label, group);
          if (i >= 4) r.status = 'queued';
        });
        S.dialog = null;
        S.runsMode = 'table';
        S.compare = false;
        openTab('runs');
        toast(combos.length > 1 ? `已开始 ${combos.length} 次运行（运行组“${d.name}”）` : `已开始 ${d.name}`);
        break;
      }
      case 'nb-run':
        S.nb.ran = true;
        toast('单元格 [3] 已运行 · 内核 Python 3.11.9 (.venv)');
        break;
      case 'inline':
        close();
        if (S.folder !== 'timing') S.folder = 'timing';
        openTab('f:train.py');
        S.inline = true;
        S.inlineFresh = true;
        break;
      case 'inline-accept':
        S.inline = false;
        toast('已应用到 train.py（Ctrl+Z 可撤消）');
        break;
      case 'inline-reject':
        S.inline = false;
        break;
      case 'dock':
        S.dock = !S.dock;
        if (!S.dock) S.ai = null;
        break;
      case 'ai':
        S.dock = true;
        S.ai = el.dataset.topic;
        break;
      case 'apply-ai':
      case 'apply-run': {
        S.ai = null;
        if (!S.changes.some((c) => c.path === 'configs/base.yaml')) S.changes.push({ path: 'configs/base.yaml', kind: 'M' });
        if (a === 'apply-run') {
          const r = startRun({ window: 16, audio: 'on', state: 'on', lr: '3e-4', seed: 1 }, 'baseline-r3');
          S.panel = { open: true, tab: 'run', run: r.id };
          toast('已修改 configs/base.yaml 并开始 baseline-r3');
        } else toast('已修改 configs/base.yaml（在源代码管理里可以看到差异）');
        break;
      }
      case 'ai-seeds': {
        S.ai = null;
        const group = 'g' + (Object.keys(S.groups).length + 1);
        S.groups[group] = { name: '消融补种子', by: 'ai' };
        S.groupsOpen[group] = true;
        let i = 0;
        for (const v of [{ audio: 'on', state: 'on' }, { audio: 'off', state: 'on' }, { audio: 'on', state: 'off' }])
          for (const seed of [1, 2]) {
            const r = startRun({ window: 8, ...v, lr: '3e-4', seed }, `${v.audio === 'off' ? 'no-audio' : v.state === 'off' ? 'no-state' : 'full'} seed=${seed}`, group, { by: 'ai' });
            if (i++ >= 4) r.status = 'queued';
          }
        S.compare = false;
        openTab('runs');
        toast('AI 已开始 6 次运行（运行组“消融补种子”）');
        break;
      }
      case 'annotate':
        S.annotate = !S.annotate;
        break;
      case 'theme':
        S.theme = S.theme === 'graphite' ? 'night' : 'graphite';
        break;
      case 'reset':
        S = fresh();
        break;
      case 'toast':
        ev.stopPropagation();
        close();
        toast(el.dataset.text);
        break;
      default:
        return;
    }
    if (!['menu', 'quick'].includes(a) && !el.closest('.menu') && !el.closest('.quick')) S.menu = null;
    render();
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) {
      if (S.menu) {
        S.menu = null;
        render();
      }
      return;
    }
    if (el.disabled) return;
    act(el, ev);
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    const k = el.dataset.input;
    if (!k) return;
    if (k === 'commitMsg') S.commitMsg = el.value;
    else if (k === 'runFilter') {
      S.runFilter = el.value;
      render();
    } else if (k === 'notes') runById(el.dataset.id).notes = el.value;
    else if (k === 'd-name') S.dialog.name = el.value;
    else if (k === 'd-val') {
      S.dialog.values[el.dataset.p] = el.value;
      render();
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (S.quick) S.quick = null;
      else if (S.menu) S.menu = null;
      else if (S.dialog) S.dialog = null;
      else if (S.inline) S.inline = false;
      else return;
      render();
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'p') {
      ev.preventDefault();
      S.quick = { kind: 'files' };
      render();
    }
  });

  // Line-chart crosshair.
  const tip = document.createElement('div');
  tip.className = 'tooltip';
  tip.hidden = true;
  document.body.append(tip);
  document.addEventListener('mousemove', (ev) => {
    const hover = ev.target.closest?.('[data-hover]');
    document.querySelectorAll('.hover-line').forEach((l) => {
      if (!hover || !l.closest('svg').contains(hover)) l.setAttribute('visibility', 'hidden');
    });
    if (!hover) {
      tip.hidden = true;
      return;
    }
    const c = CHARTS.get(hover.dataset.hover);
    const svg = hover.closest('svg');
    if (!c) return;
    const box = svg.getBoundingClientRect();
    const vx = ((ev.clientX - box.left) / box.width) * c.w;
    let bx = c.xs[0];
    let dist = Infinity;
    for (const x of c.xs) {
      const d = Math.abs(c.X(x) - vx);
      if (d < dist) [dist, bx] = [d, x];
    }
    const line = svg.querySelector('.hover-line');
    line.setAttribute('x1', c.X(bx));
    line.setAttribute('x2', c.X(bx));
    line.setAttribute('visibility', 'visible');
    const rows = c.series.map((s) => [s, s.pts.find((p) => p[0] === bx)]).filter(([, p]) => p).sort((a, b) => b[1][1] - a[1][1]);
    tip.innerHTML = `<b>${c.xLabel} ${bx}</b>${rows.map(([s, p]) => `<div><i style="background:${s.color}"></i><span>${esc(s.name)}</span><span>${(+p[1]).toFixed(3)}</span></div>`).join('')}`;
    tip.hidden = false;
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = ev.clientY + 14 + 'px';
  });
  window.addEventListener('resize', placeBadges);

  // Simulated progress of running programs.
  setInterval(() => {
    let changed = false;
    for (const r of S.runs.filter((x) => x.status === 'running')) {
      const before = Math.floor(r.epoch);
      r.epoch = Math.min(10, r.epoch + (r.id === 'r7' ? 0.25 : 0.5));
      const now = Math.floor(r.epoch);
      if (now > before && now >= 1) {
        r.curves.f1.push([now, +(r.target * (1 - 0.62 * Math.exp(-(now - 1) / 2.2)) + Math.sin(now * 1.7 + r.seedv) * 0.004).toFixed(4)]);
        r.curves.loss.push([now, +(0.18 + (0.72 - r.target) * 0.9 + 0.7 * Math.exp(-(now - 1) / 2.4)).toFixed(4)]);
        r.dur = `${now * 4}m`;
      }
      if (r.epoch >= 10) {
        r.status = 'done';
        const f1 = r.curves.f1.at(-1)[1];
        r.m = { f1, ft: +(30 - f1 * 26).toFixed(1), lat: r.params.audio === 'off' ? 0.62 : r.params.window === 4 ? 0.58 : 0.81 };
        const next = S.runs.find((x) => x.status === 'queued' && x.folder === r.folder);
        if (next) next.status = 'running';
        toast(`${r.name} 已完成 · f1 ${f1.toFixed(3)}`);
      }
      changed = true;
    }
    if (changed && !S.dialog && !S.menu && !S.quick) render();
  }, 4000);

  render();
})();

</script>
</body>
</html>
