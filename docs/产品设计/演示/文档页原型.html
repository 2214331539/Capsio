<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsio · 文档页原型</title>
<style>
/* Capsio experiment workspace prototype: an IDE layout inside the app shell. */
:root,
[data-theme='graphite'] {
  --chrome: #f4f4f5;
  --canvas: #ffffff;
  --raised: #ffffff;
  --sunken: #fafafa;
  --hover: rgba(24, 24, 27, 0.045);
  --selected: rgba(24, 24, 27, 0.075);
  --focus-row: rgba(59, 91, 219, 0.1);
  --line: rgba(24, 24, 27, 0.08);
  --line-strong: rgba(24, 24, 27, 0.15);
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #71717a;
  --text-4: #a1a1aa;
  --accent: #18181b;
  --on-accent: #ffffff;
  --link: #2f5bd3;
  --ok: #2f7d4f;
  --warn: #a5650e;
  --bad: #c0392b;
  --info: #3b5bdb;
  --git-m: #a5650e;
  --git-a: #2f7d4f;
  --git-d: #c0392b;
  --add-bg: rgba(47, 125, 79, 0.09);
  --del-bg: rgba(192, 57, 43, 0.08);
  --shadow-pop: 0 0 0 1px rgba(0, 0, 0, 0.07), 0 10px 32px rgba(0, 0, 0, 0.12);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --code-kw: #7c3aed;
  --code-str: #2f7d4f;
  --code-num: #b45309;
  --code-com: #8b8b93;
  --note: #e8590c;
  color-scheme: light;
}
[data-theme='night'] {
  --chrome: #0e0e10;
  --canvas: #151517;
  --raised: #1c1c1f;
  --sunken: #121214;
  --hover: rgba(255, 255, 255, 0.05);
  --selected: rgba(255, 255, 255, 0.085);
  --focus-row: rgba(123, 147, 240, 0.16);
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #ededef;
  --text-2: #a3a3ab;
  --text-3: #85858e;
  --text-4: #5b5b63;
  --accent: #ededef;
  --on-accent: #111113;
  --link: #8aa4ff;
  --ok: #4fae73;
  --warn: #d49a3a;
  --bad: #e5675a;
  --info: #7b93f0;
  --git-m: #d49a3a;
  --git-a: #4fae73;
  --git-d: #e5675a;
  --add-bg: rgba(79, 174, 115, 0.11);
  --del-bg: rgba(229, 103, 90, 0.11);
  --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 10px 32px rgba(0, 0, 0, 0.5);
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #008300;
  --code-kw: #b197fc;
  --code-str: #69db7c;
  --code-num: #ffa94d;
  --code-com: #6f6f78;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  font: 13px/1.5 'Segoe UI Variable Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', system-ui, sans-serif;
  color: var(--text);
  background: var(--chrome);
  -webkit-font-smoothing: antialiased;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
svg.i {
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mono {
  font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
}
.muted {
  color: var(--text-3);
}
.spacer {
  flex: 1;
}

/* Shell */
.app {
  display: grid;
  grid-template-rows: 44px minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
  min-width: 1100px;
  min-height: 680px;
}
.titlebar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  padding: 0 8px 0 12px;
}
.logo {
  width: 18px;
  height: 18px;
  margin-right: 8px;
}
.ib {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  min-width: 28px;
  padding: 0 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  white-space: nowrap;
}
.ib:hover {
  background: var(--hover);
  color: var(--text);
}
.ib[aria-pressed='true'] {
  background: var(--selected);
  color: var(--text);
}
.ib:disabled {
  opacity: 0.4;
  cursor: default;
  background: transparent;
}
.ib.sm {
  height: 22px;
  min-width: 22px;
  padding: 0 3px;
}
.crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 6px;
  color: var(--text-3);
}
.crumbs b {
  color: var(--text);
  font-weight: 500;
}
.tb-search {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  width: 400px;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 7px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text-3);
  text-align: left;
}
.tb-search kbd {
  margin-left: auto;
  font-size: 11px;
}
.tb-sep {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: var(--line-strong);
}
.body {
  display: flex;
  min-width: 0;
  min-height: 0;
  padding: 0 8px 8px 0;
}

/* Sidebar */
.sidebar {
  width: 248px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 6px 8px 8px;
}
.uplink {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 26px;
  padding: 0 8px 0 4px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
}
.switcher {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  margin: 2px 0 6px;
  padding: 6px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
}
.mark {
  width: 18px;
  height: 24px;
  flex: none;
  border-radius: 2px 4px 4px 2px;
  background: #4f5866;
  box-shadow: inset 3px 0 0 rgba(0, 0, 0, 0.22);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  height: 30px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  text-align: left;
}
.nav-item:hover {
  background: var(--hover);
  color: var(--text);
}
.nav-item[aria-current] {
  background: var(--selected);
  color: var(--text);
  font-weight: 500;
}
.views {
  display: flex;
  gap: 2px;
  margin-top: 10px;
  padding: 8px 0 6px;
  border-top: 1px solid var(--line);
}
.views .ib {
  position: relative;
  flex: 1;
  height: 30px;
}
.views .ib[aria-pressed='true'] {
  color: var(--text);
}
.views .ib[aria-pressed='true']::after {
  content: '';
  position: absolute;
  left: 28%;
  right: 28%;
  bottom: -3px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.views .badge {
  position: absolute;
  top: 0;
  right: 4px;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--info);
  color: #fff;
  font: 600 10px/15px 'Segoe UI', sans-serif;
}
.view-title {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 28px;
  padding: 0 2px 0 6px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-3);
}
.view {
  flex: 1;
  min-height: 0;
  overflow: auto;
  margin: 0 -8px;
  padding: 0 8px 8px;
}
.sec {
  margin-top: 4px;
}
.sec-head {
  display: flex;
  align-items: center;
  gap: 2px;
  width: 100%;
  height: 24px;
  padding: 0 2px 0 2px;
  border: 0;
  background: transparent;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-2);
  text-align: left;
}
.sec-head .t {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 4px;
}
.sec-head .n {
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: 8px;
  background: var(--selected);
  font-size: 10.5px;
  font-weight: 500;
  line-height: 16px;
  color: var(--text-2);
}
.sec-head .acts {
  display: none;
}
.sec:hover .sec-head .acts {
  display: inline-flex;
}
.row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  height: 24px;
  padding: 0 6px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
  font-size: 12.5px;
  text-align: left;
  white-space: nowrap;
}
.row:hover {
  background: var(--hover);
  color: var(--text);
}
.row[aria-current] {
  background: var(--focus-row);
  color: var(--text);
}
.row .name {
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .dir {
  color: var(--text-4);
  font-size: 11.5px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .end {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--text-3);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.row .hov {
  display: none;
}
.row:hover .hov {
  display: inline-flex;
}
.row:hover .unhov {
  display: none;
}
.row svg.i {
  color: var(--text-3);
}
.git {
  width: 12px;
  text-align: center;
  font: 600 11px 'Cascadia Code', Consolas, monospace;
}
.git.M,
.name.M {
  color: var(--git-m);
}
.git.A,
.git.U,
.name.A,
.name.U {
  color: var(--git-a);
}
.git.D {
  color: var(--git-d);
}
.dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--text-4);
}
.dot.run {
  background: var(--info);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--info) 22%, transparent);
}
.dot.done {
  background: var(--ok);
}
.dot.fail {
  background: var(--bad);
}
.inputbox {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  margin: 4px 0;
  padding: 0 8px;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}
.inputbox input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 12.5px;
}
.inputbox .opt {
  padding: 0 3px;
  border-radius: 3px;
  font: 11px 'Cascadia Code', Consolas, monospace;
  color: var(--text-3);
}
textarea.msg-input {
  width: 100%;
  min-height: 52px;
  margin: 2px 0 6px;
  padding: 7px 9px;
  border: 0;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  outline: 0;
  resize: vertical;
  font-size: 12.5px;
  line-height: 1.5;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
}
.btn:hover {
  background: var(--hover);
}
.btn.primary {
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: none;
}
.btn.primary:hover {
  filter: brightness(1.15);
}
.btn.sm {
  height: 24px;
  padding: 0 8px;
  font-size: 12px;
}
.btn.block {
  width: 100%;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.link {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--link);
  font-size: 12.5px;
}
.link:hover {
  text-decoration: underline;
}
.side-foot {
  display: flex;
  align-items: center;
  gap: 2px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.account {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 36px;
  padding: 0 6px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
}
.avatar {
  width: 18px;
  height: 18px;
  flex: none;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: var(--selected);
  color: var(--text-2);
  font-size: 10px;
  font-weight: 600;
}
.avatar.ai {
  background: color-mix(in srgb, var(--info) 14%, transparent);
  color: var(--info);
}
.avatar.lj {
  background: color-mix(in srgb, var(--s2) 16%, transparent);
  color: var(--s2);
}

/* Main workspace */
.main-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 8px;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  border-radius: 10px;
  background: var(--canvas);
  box-shadow: 0 0 0 1px var(--line);
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 40px;
  padding: 0 8px;
  border-bottom: 1px solid var(--line);
}
.widget {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
}
.widget:hover {
  background: var(--hover);
}
.widget .sub {
  color: var(--text-3);
  font-weight: 400;
}
.widget svg.i {
  color: var(--text-3);
}
.run-btn {
  color: var(--ok);
}
.stop-btn {
  color: var(--bad);
}
.editor-tabs {
  display: flex;
  align-items: stretch;
  flex: none;
  height: 34px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--sunken);
  border-bottom: 1px solid var(--line);
}
.etab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px 0 12px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--text-3);
  font-size: 12.5px;
  white-space: nowrap;
}
.etab:hover {
  color: var(--text);
}
.etab[aria-current] {
  background: var(--canvas);
  color: var(--text);
  box-shadow: inset 0 -1px 0 var(--canvas), inset 0 2px 0 var(--accent);
}
.etab .x {
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  opacity: 0;
}
.etab[aria-current] .x,
.etab:hover .x {
  opacity: 0.7;
}
.etab .x:hover {
  background: var(--hover);
}
.etab .mod {
  width: 7px;
  height: 7px;
  margin: 0 5px;
  border-radius: 50%;
  background: var(--text-3);
}
.etab svg.i {
  color: var(--text-3);
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
  height: 28px;
  padding: 0 8px 0 14px;
  color: var(--text-3);
  font-size: 12px;
}
.workbench {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.editor {
  flex: 1;
  min-height: 0;
  overflow: auto;
  position: relative;
}
.code {
  padding: 2px 0 60px;
  font: 12.5px/1.7 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
}
.ln {
  display: flex;
}
.ln .no {
  position: relative;
  width: 56px;
  flex: none;
  padding-right: 16px;
  text-align: right;
  color: var(--text-4);
  user-select: none;
}
.ln.cur {
  background: var(--hover);
}
.ln.cur .no {
  color: var(--text-2);
}
.ln.add .no::after,
.ln.mod .no::after {
  content: '';
  position: absolute;
  right: 5px;
  top: 2px;
  bottom: 2px;
  width: 3px;
  background: var(--git-a);
}
.ln.mod .no::after {
  background: var(--git-m);
}
.ln .tx {
  white-space: pre;
  padding-right: 24px;
}
.ln.dadd {
  background: var(--add-bg);
}
.ln.ddel {
  background: var(--del-bg);
}
.ln .wavy {
  text-decoration: underline wavy var(--warn);
  text-underline-offset: 3px;
}
.tk-kw {
  color: var(--code-kw);
}
.tk-str {
  color: var(--code-str);
}
.tk-num {
  color: var(--code-num);
}
.tk-com {
  color: var(--code-com);
  font-style: italic;
}
.inline-chat {
  margin: 4px 24px 6px 56px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font: 12.5px/1.5 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
}
.inline-chat .q {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
}
.inline-chat .a {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-top: 1px solid var(--line);
}
.codelens {
  height: 18px;
  padding-left: 56px;
  font: 11.5px 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
  color: var(--text-3);
}
.codelens button {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--text-3);
}
.codelens button:hover {
  color: var(--link);
  text-decoration: underline;
}

/* Panel and status bar */
.panel {
  flex: none;
  display: flex;
  flex-direction: column;
  height: 220px;
  border-top: 1px solid var(--line);
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 32px;
  padding: 0 6px 0 6px;
}
.ptab {
  position: relative;
  height: 32px;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
}
.ptab:hover {
  color: var(--text);
}
.ptab[aria-current] {
  color: var(--text);
  font-weight: 500;
}
.ptab[aria-current]::after {
  content: '';
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 3px;
  height: 1.5px;
  background: var(--accent);
}
.ptab .n {
  display: inline-grid;
  place-items: center;
  min-width: 16px;
  height: 16px;
  margin-left: 4px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--selected);
  font-size: 10.5px;
  font-weight: 500;
}
.panel-body {
  flex: 1;
  min-height: 0;
  display: flex;
}
.panel-list {
  width: 200px;
  flex: none;
  overflow: auto;
  padding: 2px 6px;
  border-right: 1px solid var(--line);
}
.console {
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: 2px 14px 12px;
  font: 12px/1.65 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
  white-space: pre-wrap;
}
.console .err {
  color: var(--bad);
}
.console a {
  color: var(--link);
  cursor: pointer;
  text-decoration: underline;
}
.statusbar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 24px;
  padding: 0 6px;
  border-top: 1px solid var(--line);
  background: var(--sunken);
  font-size: 11.5px;
  color: var(--text-2);
}
.sb {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  white-space: nowrap;
}
.sb:hover {
  background: var(--hover);
  color: var(--text);
}
.sb.live {
  color: var(--info);
}

/* Tables */
.grid-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.grid-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  height: 30px;
  padding: 0 10px;
  background: var(--canvas);
  border-bottom: 1px solid var(--line-strong);
  color: var(--text-3);
  font-size: 12px;
  font-weight: 500;
  text-align: left;
  white-space: nowrap;
}
.grid-table thead tr:first-child th.grp {
  height: 22px;
  border-bottom: 0;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-4);
}
.grid-table thead tr + tr th {
  top: 22px;
}
.grid-table td {
  height: 30px;
  padding: 0 10px;
  border-bottom: 1px solid var(--line);
  color: var(--text-2);
  white-space: nowrap;
}
.grid-table tr.r:hover td {
  background: var(--hover);
}
.grid-table tr.r.sel td {
  background: var(--focus-row);
}
.grid-table td:first-child,
.grid-table th:first-child {
  padding-left: 14px;
}
.grid-table .num {
  text-align: right;
}
.grid-table .best {
  color: var(--text);
  font-weight: 650;
}
.grid-table .sep {
  border-left: 1px solid var(--line);
}
.grid-table .nm {
  color: var(--text);
}
.grid-table tr.grp-row td {
  height: 28px;
  background: var(--sunken);
  font-size: 12px;
  cursor: pointer;
}
.hist {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  height: 16px;
  margin: 2px 0 4px;
}
.hist i {
  width: 6px;
  background: color-mix(in srgb, var(--s1) 55%, transparent);
}
.check {
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: var(--accent);
}
.progress {
  display: inline-block;
  width: 56px;
  height: 4px;
  border-radius: 2px;
  background: var(--selected);
  overflow: hidden;
  vertical-align: middle;
}
.progress i {
  display: block;
  height: 100%;
  background: var(--info);
}
.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ver {
  font: 12px 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.ver em {
  font-style: normal;
  color: var(--warn);
}
.subbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  height: 38px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
}
.seg {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border-radius: 7px;
  background: var(--hover);
}
.seg button {
  height: 22px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
}
.seg button[aria-pressed='true'] {
  background: var(--canvas);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.05);
}
.filter {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 240px;
  height: 26px;
  padding: 0 8px;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}
.filter input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 12px;
}
.pane-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.pane {
  min-width: 0;
  padding: 12px 16px 10px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.pane:nth-child(2n) {
  border-right: 0;
}
.pane-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  font-size: 12px;
  font-weight: 600;
}
.chart svg {
  display: block;
  width: 100%;
  overflow: visible;
}
.chart .grid line {
  stroke: var(--line);
}
.chart .axis text {
  fill: var(--text-3);
  font-size: 11px;
}
.chart .label {
  fill: var(--text-2);
  font-size: 11px;
}
.chart .hover-line {
  stroke: var(--text-4);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 4px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.legend button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 7px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--text-2);
}
.legend button:hover {
  background: var(--hover);
}
.legend button.off {
  color: var(--text-4);
}
.legend i {
  width: 12px;
  height: 2px;
  border-radius: 1px;
}
.legend button.off i {
  background: var(--text-4) !important;
}
.tooltip {
  position: fixed;
  z-index: 100;
  min-width: 140px;
  padding: 7px 10px;
  border-radius: 7px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12px;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.tooltip b {
  display: block;
  margin-bottom: 3px;
  font-weight: 600;
}
.tooltip div {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tooltip div span:last-child {
  margin-left: auto;
  padding-left: 12px;
}
.tooltip i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* Documents inside editors */
.doc {
  max-width: 1000px;
  padding: 16px 24px 40px;
}
.doc-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.doc-head h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}
.doc h2 {
  margin: 20px 0 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.kv {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  gap: 5px 14px;
  margin: 0;
  font-size: 12.5px;
}
.kv dt {
  color: var(--text-3);
}
.kv dd {
  margin: 0;
}
.subnav {
  display: flex;
  gap: 2px;
  margin-top: 10px;
  border-bottom: 1px solid var(--line);
}
.subnav button {
  position: relative;
  height: 32px;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--text-3);
}
.subnav button[aria-current] {
  color: var(--text);
  font-weight: 500;
}
.subnav button[aria-current]::after {
  content: '';
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 2px;
  background: var(--accent);
}
.note-area {
  width: 100%;
  min-height: 60px;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: var(--sunken);
  box-shadow: inset 0 0 0 1px var(--line);
  outline: 0;
  resize: vertical;
  line-height: 1.6;
}
.alert {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-left: 3px solid var(--bad);
  background: color-mix(in srgb, var(--bad) 7%, transparent);
  font-size: 12.5px;
}
.welcome-head {
  padding: 64px 56px 28px;
}
.welcome-head h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.welcome {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 340px);
  gap: 56px;
  padding: 0 56px 40px;
}
.welcome h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.welcome h2 {
  margin: 26px 0 6px;
  font-size: 14px;
  font-weight: 600;
}
.welcome .lk {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--link);
  font-size: 13px;
}
.welcome .lk:hover {
  text-decoration: underline;
}
.welcome .recent {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 26px;
  font-size: 13px;
  white-space: nowrap;
}
.welcome .recent .muted {
  overflow: hidden;
  text-overflow: ellipsis;
}
.welcome .recent .muted {
  font-size: 12px;
}

/* Notebook */
.nb-bar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
  height: 34px;
  padding: 0 10px;
  border-bottom: 1px solid var(--line);
}
.cell {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  margin-right: 20px;
  padding: 6px 0;
}
.cell .gutter {
  padding: 8px 10px 0 0;
  text-align: right;
  font: 11.5px 'Cascadia Code', Consolas, monospace;
  color: var(--text-4);
}
.cell .src {
  border-radius: 6px;
  background: var(--sunken);
  box-shadow: inset 0 0 0 1px var(--line);
  padding: 8px 12px;
  font: 12.5px/1.65 'Cascadia Code', Consolas, monospace;
  white-space: pre;
  overflow-x: auto;
}
.cell.md .src {
  background: transparent;
  box-shadow: none;
  font: 13px/1.6 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
  white-space: normal;
}
.cell.md h3 {
  margin: 4px 0;
  font-size: 15px;
}
.cell.active .src {
  box-shadow: inset 0 0 0 1px var(--info);
}
.cell .out {
  grid-column: 2;
  margin-top: 6px;
  padding: 2px 12px;
  font: 12px/1.6 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.cell .out table {
  border-collapse: collapse;
  font-size: 12px;
}
.cell .out th,
.cell .out td {
  padding: 3px 14px 3px 0;
  border-bottom: 1px solid var(--line);
  text-align: right;
}
.cell .out th {
  color: var(--text-3);
  font-weight: 500;
}

/* Git graph */
.log-row {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 90px 80px 76px;
  align-items: center;
  min-height: 32px;
  padding-right: 14px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  cursor: default;
}
.log-row:hover {
  background: var(--hover);
}
.log-row.sel {
  background: var(--focus-row);
}
.log-row .rail {
  position: relative;
  align-self: stretch;
}
.log-row .rail::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--s1);
}
.log-row .rail.side::after {
  content: '';
  position: absolute;
  left: 31px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--s2);
}
.log-row .rail.first::before {
  top: 16px;
}
.log-row .rail i {
  position: absolute;
  left: 15px;
  top: 11px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--canvas);
  box-shadow: inset 0 0 0 2px var(--s1);
}
.log-row .rail i.b {
  left: 27px;
  box-shadow: inset 0 0 0 2px var(--s2);
}
.log-row .msg {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}
.log-detail {
  padding: 10px 16px 12px 58px;
  border-bottom: 1px solid var(--line);
  background: var(--sunken);
  font-size: 12.5px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  padding: 0 6px;
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  font: 11px 'Cascadia Code', Consolas, monospace;
  color: var(--text-2);
}
.tag.run {
  box-shadow: none;
  background: var(--selected);
  font-family: inherit;
  cursor: pointer;
}
.diff2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  font: 12.5px/1.7 'Cascadia Code', Consolas, monospace;
}
.diff2 > div + div {
  border-left: 1px solid var(--line);
}

/* Overlays */
.quick {
  position: fixed;
  left: 50%;
  top: 52px;
  z-index: 60;
  width: 580px;
  transform: translateX(-50%);
  border-radius: 9px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
.quick .qin {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  margin: 6px;
  padding: 0 10px;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1.5px var(--accent);
  color: var(--text-3);
}
.quick .qin input {
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
}
.quick .ql {
  padding: 6px 14px 2px;
  font-size: 11.5px;
  color: var(--text-3);
}
.quick .qi {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 30px;
  padding: 4px 14px;
  border: 0;
  background: transparent;
  text-align: left;
}
.quick .qi:hover {
  background: var(--focus-row);
}
.quick .qi small {
  margin-left: auto;
  color: var(--text-3);
  font-size: 12px;
}
.quick .qi .mono {
  font-size: 11.5px;
  color: var(--text-3);
}
.quick .list {
  max-height: 380px;
  overflow: auto;
  padding-bottom: 6px;
}
.quick-scrim {
  position: fixed;
  inset: 0;
  z-index: 55;
}
.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: start center;
  padding-top: 10vh;
  background: rgba(12, 12, 14, 0.24);
}
.dialog {
  width: 560px;
  border-radius: 10px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.dialog-head {
  display: flex;
  align-items: center;
  padding: 14px 12px 4px 20px;
  font-size: 15px;
  font-weight: 600;
}
.dialog-body {
  padding: 10px 20px;
}
.dialog-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px 14px 20px;
  font-size: 12.5px;
}
.form-row {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 12.5px;
}
.form-row > label {
  color: var(--text-2);
}
.field {
  width: 100%;
  height: 28px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: var(--canvas);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  outline: 0;
}
.field:focus {
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
.ptable {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.ptable th {
  padding: 4px 6px 4px 0;
  border-bottom: 1px solid var(--line-strong);
  color: var(--text-3);
  font-weight: 500;
  font-size: 12px;
  text-align: left;
}
.ptable td {
  padding: 4px 6px 4px 0;
  border-bottom: 1px solid var(--line);
}
.ptable td:first-child {
  width: 80px;
  font: 12px 'Cascadia Code', Consolas, monospace;
}
.ptable .field {
  height: 26px;
  font: 12px 'Cascadia Code', Consolas, monospace;
}
.menu {
  position: fixed;
  z-index: 60;
  min-width: 230px;
  padding: 4px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.menu button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  text-align: left;
  font-size: 12.5px;
}
.menu button:hover {
  background: var(--focus-row);
}
.menu button kbd {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-3);
}
.menu hr {
  height: 1px;
  margin: 4px 6px;
  border: 0;
  background: var(--line);
}
.menu .ml {
  padding: 5px 10px 2px;
  font-size: 11.5px;
  color: var(--text-3);
}
.toast {
  position: fixed;
  right: 24px;
  bottom: 60px;
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 440px;
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12.5px;
}
.toast svg.i {
  color: var(--info);
}

/* AI dock */
.dock {
  width: 340px;
  flex: none;
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  background: var(--canvas);
  box-shadow: 0 0 0 1px var(--line);
  overflow: hidden;
}
.dock-head {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 40px;
  padding: 0 6px 0 12px;
  border-bottom: 1px solid var(--line);
}
.dock-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 13px;
  line-height: 1.65;
}
.msg.me {
  align-self: flex-end;
  max-width: 90%;
  padding: 7px 11px;
  border-radius: 10px;
  background: var(--selected);
}
.ctx {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: 4px;
  background: var(--hover);
  font-size: 11.5px;
  color: var(--text-2);
}
.codeblock {
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  overflow: hidden;
  font: 12px/1.65 'Cascadia Code', Consolas, monospace;
}
.codeblock .h {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 4px 0 10px;
  border-bottom: 1px solid var(--line);
  background: var(--sunken);
  font: 12px 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
}
.codeblock .a,
.codeblock .d {
  padding: 0 10px;
  white-space: pre;
}
.codeblock .a {
  background: var(--add-bg);
  color: var(--git-a);
}
.codeblock .d {
  background: var(--del-bg);
  color: var(--git-d);
}
.composer {
  margin: 10px;
  padding: 9px 11px;
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text-3);
}

/* Prototype controls and notes */
.proto {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 9px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  font-size: 12px;
}
.proto strong {
  padding: 0 8px;
  font-weight: 600;
}
.proto .btn {
  height: 24px;
  padding: 0 8px;
  font-size: 12px;
  box-shadow: none;
  font-weight: 400;
}
.proto .btn[aria-pressed='true'] {
  background: var(--note);
  color: #fff;
}
.note-badge {
  position: fixed;
  z-index: 85;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--note);
  color: #fff;
  font: 600 11px 'Segoe UI', sans-serif;
  box-shadow: 0 0 0 2px var(--canvas);
  pointer-events: none;
}
.note-outline {
  position: fixed;
  z-index: 69;
  border: 1.5px dashed color-mix(in srgb, var(--note) 70%, transparent);
  border-radius: 6px;
  pointer-events: none;
}
.notes {
  position: fixed;
  right: 16px;
  bottom: 56px;
  z-index: 80;
  width: 380px;
  max-height: 68vh;
  overflow: auto;
  padding: 12px 16px;
  border-radius: 10px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.notes h3 {
  margin: 0 0 6px;
  font-size: 13px;
}
.notes ol {
  margin: 0;
  padding: 0;
  list-style: none;
}
.notes li {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 10px;
  padding: 7px 0;
  border-top: 1px solid var(--line);
  font-size: 12.5px;
  line-height: 1.55;
}
.notes li b {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--note);
  color: #fff;

.home-actions { display: flex; gap: 8px; margin-bottom: 28px; }
.home-h { margin: 18px 0 10px; color: var(--text-3); font-size: 12.5px; font-weight: 600; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.home-card, .tpl-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 120px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--canvas); color: var(--text); font: inherit; text-align: left; }

.home-card b, .tpl-card b { font-size: 14px; font-weight: 600; }
.home-card .muted, .tpl-card .muted { font-size: 12px; }
.hc-icon { font-size: 24px; margin-bottom: 4px; }
.home-list .row { height: 30px; }

.tool-line { display: flex; align-items: center; gap: 6px; color: var(--text-3); font: 12px 'Cascadia Code', Consolas, monospace; }
.tool-line svg.i { color: var(--ok); }
.approve { padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; }
.approve-acts { display: flex; gap: 6px; margin-top: 8px; }
.mini-doc { gap: 6px; }
.mini-page { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
.mini-page p { margin: 6px 0 0; }

.doc-dialog { width: 520px; }
.member { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.member:last-child { border-bottom: 0; }
.tpl-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tpl-card { min-height: 104px; }
.lib-item { display: flex; gap: 10px; width: 100%; padding: 10px 6px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; text-align: left; }
.lib-item:hover { background: var(--hover); }
.lib-item > span { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.lib-item svg.i { margin-top: 2px; color: var(--s1); }
.main-wrap:has(.dock) .outline { display: none; }

  function notesPanel() {
    if (!S.annotate) return '';
    return `<div class="notes"><h3>区域和参考的产品</h3><ol>${notesList().map(([t, d, ref], i) => `<li><b>${i + 1}</b><span><em>${t}</em>${esc(d)}<span class="ref">参考：${ref}</span></span></li>`).join('')}</ol></div>`;
  }
  function placeBadges() {
    document.querySelectorAll('.note-badge,.note-outline').forEach((n) => n.remove());
    if (!S.annotate) return;
    const seen = new Set();
    for (const el of document.querySelectorAll('[data-note]')) {
      const n = +el.dataset.note;
      if (seen.has(n)) continue;
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      seen.add(n);
      const o = document.createElement('div');
      o.className = 'note-outline';
      Object.assign(o.style, { left: r.left - 2 + 'px', top: r.top - 2 + 'px', width: r.width + 4 + 'px', height: Math.min(r.height, window.innerHeight - r.top - 4) + 4 + 'px' });
      const b = document.createElement('div');
      b.className = 'note-badge';
      b.textContent = n;
      Object.assign(b.style, { left: r.left - 9 + 'px', top: r.top - 9 + 'px' });
      document.body.append(o, b);
    }
  }

  // ---------- Render ----------
  function render() {
    const scrolls = {};
    document.querySelectorAll('[data-scroll]').forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
    const focused = document.activeElement?.dataset?.input;
    const conflictNote = S.page === 'abl' ? '' : '';
    document.getElementById('root').innerHTML = `<div class="app" data-theme="${S.theme}">
      ${titlebar()}
      <div class="body">${sidebar()}<div class="main-wrap"><main class="main doc-main">${S.page ? docPage() : docHome()}</main>${dock()}</div></div>
      ${dialog()}${menu()}${conflictNote}
      ${S.toast ? `<div class="toast">${icon('check', 14)}${esc(S.toast.text)}</div>` : ''}
      ${notesPanel()}
      <div class="proto"><strong>文档 · 原型</strong><button class="btn" data-act="annotate" aria-pressed="${S.annotate}">标注</button><button class="btn" data-act="theme">${S.theme === 'graphite' ? '夜' : '石墨'}</button><button class="btn" data-act="reset">重置</button></div>
    </div>`;
    document.body.dataset.theme = S.theme;
    document.querySelectorAll('[data-scroll]').forEach((el) => {
      if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll];
    });
    if (S.top) {
      const doc = document.querySelector('.doc-scroll');
      if (doc) doc.scrollTop = 0;
      S.top = false;
    }
    if (S.jump) {
      document.getElementById('h-' + S.jump)?.scrollIntoView({ block: 'start', behavior: 'smooth' });
      S.jump = null;
    }
    if (S.annotate && S.page === 'm1116') {
      // The conflict block lives on another page; mark the sync area on the status instead.
      document.querySelector('.doc-status')?.setAttribute('data-note', '5');
    }
    if (S.page === 'abl') document.querySelector('.conflict')?.setAttribute('data-note', '5');
    document.querySelector('.dock-head')?.closest('.dock')?.setAttribute('data-note', S.dock === 'ai' ? '8' : '7');
    if (focused) {
      const field = document.querySelector(`[data-input="${focused}"]`);
      field?.focus();
      field?.setSelectionRange?.(field.value.length, field.value.length);
    }
    placeBadges();
  }

  // ---------- Actions ----------
  function newPage(parent, template) {
    const id = 'new' + Date.now();
    const kind = template && template !== 'blank' ? template : null;
    const title = kind ? TITLES[kind] : '';
    S.pages.push({ id, title, icon: kind ? TEMPLATES.find((t) => t[0] === kind)[1] : '📄', parent, at: '刚刚', by: '我' });
    S.expanded.add(parent);
    S.page = id;
    S.top = true;
    S.template = { page: id, kind: kind || 'pick' };
    S.recent = [id, ...S.recent.filter((x) => x !== id)].slice(0, 5);
  }
  function act(el, ev) {
    const a = el.dataset.act;
    const id = el.dataset.id;
    const keepMenu = ['menu', 'slash-at'].includes(a);
    if (!keepMenu) S.menu = null;
    switch (a) {
      case 'open':
        S.top = true;
        S.page = id;
        S.selection = false;
        S.recent = [id, ...S.recent.filter((x) => x !== id)].slice(0, 5);
        S.dialog = null;
        break;
      case 'home':
        S.page = null;
        break;
      case 'expand':
        ev.stopPropagation();
        if (S.expanded.has(id)) S.expanded.delete(id);
        else S.expanded.add(id);
        break;
      case 'recent':
        S.recentOpen = !S.recentOpen;
        break;
      case 'menu':
        ev.stopPropagation();
        S.menu = { kind: el.dataset.kind, id, ...anchor(el) };
        break;
      case 'new':
        ev.stopPropagation();
        newPage(id || 'home');
        break;
      case 'use-template':
        S.template = { page: S.page, kind: id };
        if (id !== 'blank') {
          const t = TEMPLATES.find((x) => x[0] === id);
          Object.assign(page(S.page), { title: TITLES[id], icon: t[1] });
        } else S.template = { page: S.page, kind: 'blank' };
        break;
      case 'from-template':
        S.dialog = null;
        newPage('home', id);
        break;
      case 'star':
        S.starred = S.starred.includes(id) ? S.starred.filter((x) => x !== id) : [...S.starred, id];
        toast(S.starred.includes(id) ? '已收藏' : '已取消收藏');
        break;
      case 'delete': {
        const target = page(id);
        const drop = new Set([id]);
        for (let changed = true; changed; ) {
          changed = false;
          for (const x of S.pages) if (x.parent && drop.has(x.parent) && !drop.has(x.id)) drop.add(x.id), (changed = true);
        }
        S.trash.unshift({ id, title: target.title || '无标题', icon: target.icon, at: '刚刚删除', by: '我', pages: S.pages.filter((x) => drop.has(x.id)) });
        S.pages = S.pages.filter((x) => !drop.has(x.id));
        if (drop.has(S.page)) S.page = target.parent;
        toast(drop.size > 1 ? `已移到回收站（含 ${drop.size - 1} 个子页面）` : '已移到回收站');
        break;
      }
      case 'restore': {
        const t = S.trash.find((x) => x.id === id);
        S.trash = S.trash.filter((x) => x.id !== id);
        if (t.pages) S.pages.push(...t.pages);
        else S.pages.push({ id: t.id, title: t.title, icon: t.icon, parent: 'home', at: '刚刚', by: '我' });
        toast('已恢复');
        break;
      }
      case 'purge':
        S.trash = S.trash.filter((x) => x.id !== id);
        toast('已彻底删除');
        break;
      case 'dialog':
        S.dialog = { kind: el.dataset.kind };
        break;
      case 'close':
        S.dialog = null;
        break;
      case 'scrim':
        if (ev.target === el) S.dialog = null;
        break;
      case 'dock':
        S.dock = S.dock === id ? null : id;
        break;
      case 'slash-at':
        ev.stopPropagation();
        S.menu = { kind: 'slash', ...anchor(el, 20) };
        break;
      case 'pick-paper':
        S.dialog = { kind: 'paper' };
        break;
      case 'insert-paper': {
        const [t, meta, note] = LIBRARY[+id];
        S.inserted.push(paperCard(t, meta, note ? '论文笔记：主动任务的目标由用户先给出。' : ''));
        S.dialog = null;
        toast('已插入论文卡片');
        break;
      }
      case 'insert':
        if (id === '实验运行') S.inserted.push(runCard());
        else if (id === '表格') S.inserted.push('<table class="dtable"><thead><tr><th>&nbsp;</th><th>&nbsp;</th><th>&nbsp;</th></tr></thead><tbody><tr><td>&nbsp;</td><td></td><td></td></tr></tbody></table>');
        else if (id === '公式') S.inserted.push('<div class="math-block muted">输入 LaTeX 公式，例如 E = mc²</div>');
        else if (id === '高亮块') S.inserted.push('<div class="callout"><span class="emoji">📌</span><div class="muted">输入内容</div></div>');
        else S.inserted.push(`<p class="muted">（已插入“${esc(id)}”块）</p>`);
        toast('已插入' + id);
        break;
      case 'select': {
        const r = el.getBoundingClientRect();
        S.selection = S.selection ? false : { x: Math.max(8, r.left + r.width / 2 - 200), y: r.top - 46 };
        break;
      }
      case 'ask-ai':
        S.selection = false;
        S.dock = 'ai';
        toast('已把选中的内容带到 AI 助手');
        break;
      case 'todo':
        S.todo[id] = !S.todo[id];
        break;
      case 'toggle':
        S.toggle = !S.toggle;
        break;
      case 'conflict':
        S.conflict = id;
        toast(id === 'both' ? '两段都保留' : id === 'mine' ? '保留了你的版本' : '保留了对方的版本');
        break;
      case 'jump':
        S.jump = id;
        break;
      case 'width':
        S.width = S.width === 'wide' ? 'standard' : 'wide';
        break;
      case 'ai-weekly':
        S.ai = 'ask';
        break;
      case 'ai-allow':
        S.ai = 'done';
        if (!page('w46')) S.pages.push({ id: 'w46', title: '第 46 周周报', icon: '📄', parent: 'weekly', at: '刚刚', by: 'AI · 我确认' });
        S.expanded.add('weekly');
        toast('已新建“第 46 周周报”');
        break;
      case 'toast':
        toast(el.dataset.text);
        break;
      case 'annotate':
        S.annotate = !S.annotate;
        break;
      case 'theme':
        S.theme = S.theme === 'graphite' ? 'night' : 'graphite';
        break;
      case 'reset':
        S = fresh();
        break;
    }
    render();
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) {
      if (S.menu || S.selection) {
        S.menu = null;
        if (!ev.target.closest('.float-bar')) S.selection = false;
        render();
      }
      return;
    }
    if (el.tagName === 'INPUT' && el.type !== 'checkbox') return;
    act(el, ev);
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.dataset.input === 'search') {
      S.search = ev.target.value;
      render();
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (S.menu) S.menu = null;
      else if (S.dialog) S.dialog = null;
      else if (S.selection) S.selection = false;
      else return;
      render();
    }
  });
  window.addEventListener('resize', placeBadges);
  render();
})();

</script>
</body>
</html>
